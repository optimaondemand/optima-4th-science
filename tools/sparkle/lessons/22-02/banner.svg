<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Storm test on the jetty: gray clouds and slanted rain over the Gulf, the jetty light shining a green beam with a small wind spinner turning beside its solar panel, and the brown pelican on its own perch post.">
  <defs>
    <linearGradient id="b23sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3644"/><stop offset=".6" stop-color="#55606F"/><stop offset="1" stop-color="#7C8794"/></linearGradient>
    <linearGradient id="b23sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E5C84"/><stop offset="1" stop-color="#1D2D4A"/></linearGradient>
    <radialGradient id="b23sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".6" stop-color="#FFC266"/><stop offset="1" stop-color="#FFC266" stop-opacity="0"/></radialGradient>
    <linearGradient id="b23beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DF0A6" stop-opacity=".75"/><stop offset="1" stop-color="#7DF0A6" stop-opacity="0"/></linearGradient>
    <style>
      .b23-rays{animation:b23ray 4s ease-in-out infinite}
      .b23-beam{transform-origin:742px 66px;animation:b23sweep 6s ease-in-out infinite}
      .b23-wave{animation:b23wave 5s ease-in-out infinite}
      .b23-lamp{animation:b23glow 2.4s ease-in-out infinite}
      @keyframes b23ray{50%{opacity:.35}}
      @keyframes b23sweep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
      @keyframes b23wave{50%{transform:translateX(-14px)}}
      @keyframes b23glow{50%{opacity:.55}}
      @media (prefers-reduced-motion: reduce){.b23-rays,.b23-beam,.b23-wave,.b23-lamp{animation:none}}
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b23sky)"/>
  <g fill="#3A4350" opacity=".9"><ellipse cx="120" cy="40" rx="120" ry="34"/><ellipse cx="300" cy="30" rx="140" ry="36"/><ellipse cx="520" cy="38" rx="150" ry="34"/><ellipse cx="760" cy="26" rx="170" ry="34"/></g>
  <g class="b23-rain" stroke="#B8C4D2" stroke-width="1.6" opacity=".55"><path d="M40 60 l-12 60 M90 70 l-12 60 M150 58 l-12 60 M210 66 l-12 60 M270 60 l-12 60 M330 70 l-12 60 M390 62 l-12 60 M450 68 l-12 60 M510 60 l-12 60 M570 66 l-12 60 M630 62 l-12 60 M690 70 l-12 60"/></g>
  <style>.b23-rain{animation:b23rain .8s linear infinite}@keyframes b23rain{to{transform:translate(-6px,30px)}}.b23-spin{transform-origin:772px 92px;animation:b23spin 1s linear infinite}@keyframes b23spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){.b23-rain,.b23-spin{animation:none}}</style>
  <rect y="136" width="920" height="64" fill="url(#b23sea)"/>
  <g class="b23-wave" fill="none" stroke="#9FB8D8" stroke-width="2" opacity=".55">
    <path d="M0 160 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M10 182 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <!-- the jetty: a long rock wall -->
  <path d="M560 146 q20 -10 40 -6 q18 -10 36 -4 q20 -12 40 -5 q16 -9 34 -3 q18 -10 34 -2 q20 -9 40 -3 q18 -8 36 0 q20 -8 40 -2 q22 -6 60 0 V160 H560z" fill="#4A4A55"/>
  <path d="M560 150 q30 -6 60 -1 q30 -7 60 -1 q30 -6 60 0 q30 -7 60 0 q30 -6 60 0 V160 H560z" fill="#3A3A44"/>
  <!-- the jetty light: tower, solar panel, lantern -->
  <rect x="733" y="86" width="18" height="56" fill="#E9ECEF"/><rect x="733" y="100" width="18" height="10" fill="#2F7A55"/><rect x="733" y="122" width="18" height="10" fill="#2F7A55"/>
  <rect x="728" y="82" width="28" height="6" fill="#5B6B78"/>
  <rect x="736" y="62" width="12" height="20" rx="3" fill="#1E3A2A"/>
  <circle class="b23-lamp" cx="742" cy="68" r="9" fill="#7DF0A6"/>
  <g transform="translate(704 90) rotate(-24)"><rect width="30" height="18" fill="#1F3B66" stroke="#C9D3E0" stroke-width="2"/><path d="M10 0 v18 M20 0 v18 M0 9 h30" stroke="#5A7BB0" stroke-width="1.5"/></g>
  <line x1="726" y1="96" x2="733" y2="98" stroke="#5B6B78" stroke-width="3"/>
  <line x1="751" y1="96" x2="772" y2="92" stroke="#5B6B78" stroke-width="3"/>
  <g class="b23-spin"><path d="M772 92 l0 -16 q8 6 0 16 M772 92 l14 8 q-10 2 -14 -8 M772 92 l-14 8 q4 -10 14 -8" fill="#E9ECEF" stroke="#C9D3E0"/></g>
  <circle cx="772" cy="92" r="3" fill="#5B6B78"/>
  <g class="b23-beam"><path d="M742 66 L920 30 L920 102 Z" fill="url(#b23beam)"/></g>
  <!-- a post with a brown pelican -->
  <rect x="840" y="126" width="10" height="42" fill="#6B4E32"/>
  <g transform="translate(818 70)">
    <path d="M22 50 C8 50 2 40 6 32 C10 24 24 22 36 26 C48 30 52 42 44 48 C38 52 30 51 22 50 Z" fill="#6E5A4A"/>
    <path d="M30 28 C26 40 40 44 44 46" fill="none" stroke="#4E3F33" stroke-width="2"/>
    <path d="M14 30 C10 20 12 10 18 6 C22 3 27 4 28 8" fill="none" stroke="#F1EBDD" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 8 C29 5 27 1 23 1 C19 1 17 4 17 7 Z" fill="#F1EBDD"/>
    <path d="M18 5 L-14 14 L-12 17 L19 10 Z" fill="#C9A15B"/>
    <path d="M18 10 C8 16 -4 18 -12 17" fill="#A9845A" opacity=".9"/>
    <circle cx="22" cy="4.5" r="1.4" fill="#222"/>
    <path d="M24 50 v8 M32 50 v8" stroke="#E0B060" stroke-width="2.5"/>
  </g>
  <!-- a sailboat heading for the harbor -->
  <g transform="translate(400 112)"><path d="M0 26 h40 l-6 8 h-28 z" fill="#E9ECEF"/><path d="M20 0 v26 M20 2 l14 22 h-14 z" fill="#F4F1E6" stroke="#E9ECEF"/><circle cx="20" cy="0" r="2" fill="#E8636B"/></g>
</svg>
