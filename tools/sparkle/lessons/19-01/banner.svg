<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A brown pelican diving fast into the Gulf at sunrise, with a big splash and small fish darting away">
  <defs>
    <linearGradient id="b19sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27457A"/><stop offset=".55" stop-color="#C97A6B"/><stop offset="1" stop-color="#F7C277"/></linearGradient>
    <linearGradient id="b19sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F86A8"/><stop offset="1" stop-color="#174B6B"/></linearGradient>
    <radialGradient id="b19sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".6" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <linearGradient id="b19wing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A4A3A"/><stop offset="1" stop-color="#8A7660"/></linearGradient>
  </defs>
  <rect width="920" height="200" fill="url(#b19sky)"/>
  <circle cx="790" cy="124" r="60" fill="url(#b19sun)"/>
  <circle cx="790" cy="124" r="22" fill="#FFE8A6"/>
  <!-- the pier -->
  <g fill="#3A2E3F" opacity=".85">
    <rect x="20" y="104" width="300" height="7"/>
    <rect x="34" y="111" width="5" height="22"/><rect x="94" y="111" width="5" height="22"/><rect x="154" y="111" width="5" height="22"/><rect x="214" y="111" width="5" height="22"/><rect x="274" y="111" width="5" height="22"/>
    <rect x="20" y="94" width="300" height="2.5"/><rect x="40" y="94" width="2.5" height="10"/><rect x="120" y="94" width="2.5" height="10"/><rect x="200" y="94" width="2.5" height="10"/><rect x="280" y="94" width="2.5" height="10"/>
  </g>
  <!-- the Gulf -->
  <rect x="0" y="124" width="920" height="76" fill="url(#b19sea)"/>
  <g stroke="#FFE3A3" stroke-width="2" stroke-linecap="round" opacity=".75">
    <line x1="760" y1="134" x2="820" y2="134"/><line x1="745" y1="146" x2="836" y2="146"/><line x1="770" y1="160" x2="812" y2="160"/>
  </g>
  <g stroke="#A9D6EA" stroke-width="2" fill="none" opacity=".55">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="6s" repeatCount="indefinite"/>
      <path d="M40 150 q15 -5 30 0 t30 0"/><path d="M180 170 q15 -5 30 0 t30 0"/><path d="M380 182 q15 -5 30 0 t30 0"/><path d="M660 176 q15 -5 30 0 t30 0"/>
    </g>
  </g>
  <!-- speed lines along the dive path -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 10" opacity=".8">
    <line x1="350" y1="-6" x2="420" y2="52"><animate attributeName="stroke-dashoffset" values="0;-48" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="392" y1="-18" x2="452" y2="32"><animate attributeName="stroke-dashoffset" values="0;-48" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="320" y1="28" x2="388" y2="84"><animate attributeName="stroke-dashoffset" values="0;-48" dur="0.8s" repeatCount="indefinite"/></line>
  </g>
  <!-- the brown pelican, folded wings, bill first -->
  <g transform="translate(522 62) rotate(40) scale(1.3)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-3 0;3 0;-3 0" dur="1.2s" repeatCount="indefinite"/>
      <path d="M-58 -2 L-14 -12 L-6 -2 L-14 8 Z" fill="url(#b19wing)"/>
      <path d="M-66 6 L-18 -4 L-10 4 L-22 14 Z" fill="#4A3C30"/>
      <ellipse cx="-6" cy="0" rx="30" ry="10" fill="#7E6B57"/>
      <path d="M-36 -2 L-48 -6 L-46 2 Z" fill="#4A3C30"/>
      <path d="M20 -4 Q30 -6 36 -3 L36 3 Q28 5 20 4 Z" fill="#6B4A2E"/>
      <ellipse cx="40" cy="0" rx="9" ry="7" fill="#F4EBD3"/>
      <circle cx="42" cy="-2" r="1.6" fill="#1A1A1A"/>
      <path d="M46 -3 L96 -1 L96 1.5 L46 2 Z" fill="#C9A55A"/>
      <path d="M48 2 Q72 10 94 2 Z" fill="#9C7A3E"/>
    </g>
  </g>
  <!-- the splash where it will hit -->
  <g fill="#FFFFFF">
    <ellipse cx="604" cy="128" rx="38" ry="6" fill="#DFF3FB" opacity=".9"/>
    <g>
      <animate attributeName="opacity" values=".55;1;.55" dur="1.2s" repeatCount="indefinite"/>
      <path d="M576 128 L582 104 L588 128 Z"/><path d="M590 128 L598 92 L606 128 Z"/><path d="M608 128 L616 98 L623 128 Z"/><path d="M624 128 L630 110 L635 128 Z"/>
      <circle cx="578" cy="96" r="3"/><circle cx="604" cy="82" r="3.5"/><circle cx="628" cy="94" r="2.6"/><circle cx="592" cy="86" r="2.2"/><circle cx="618" cy="84" r="2.4"/>
    </g>
  </g>
  <!-- small fish darting away under the water -->
  <g fill="#D7E4EA">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-8 2;0 0" dur="2.2s" repeatCount="indefinite"/>
      <path d="M560 160 q12 -6 22 0 q-10 6 -22 0 Z M582 160 l8 -5 l0 10 Z"/>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;8 -2;0 0" dur="1.9s" repeatCount="indefinite"/>
      <path d="M690 170 q-12 -6 -22 0 q10 6 22 0 Z M668 170 l-8 -5 l0 10 Z"/>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-6 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
      <path d="M600 182 q10 -5 18 0 q-8 5 -18 0 Z M618 182 l6 -4 l0 8 Z"/>
    </g>
  </g>
</svg>
