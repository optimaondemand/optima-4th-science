<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Sunrise at the Palmetto Springs creek. A gold pan sits at the water's edge holding glittering nuggets and pebbles, with mist on the water and a dragonfly hovering.">
  <defs>
    <linearGradient id="b292sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB8D8"/><stop offset=".6" stop-color="#F6C98E"/><stop offset="1" stop-color="#F9DDB0"/></linearGradient>
    <linearGradient id="b292water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DB7C4"/><stop offset="1" stop-color="#4F7F8E"/></linearGradient>
    <radialGradient id="b292sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".45" stop-color="#FFD978" stop-opacity=".8"/><stop offset="1" stop-color="#FFD978" stop-opacity="0"/></radialGradient>
    <radialGradient id="b292pan" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#5E6266"/><stop offset="1" stop-color="#2B2E31"/></radialGradient>
    <style>
      .b292-tw { animation: b292tw 1.8s ease-in-out infinite; } .b292-tw2 { animation-delay: .6s; } .b292-tw3 { animation-delay: 1.2s; }
      @keyframes b292tw { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
      .b292-mist { animation: b292mist 9s ease-in-out infinite alternate; }
      @keyframes b292mist { from { transform: translateX(-20px); } to { transform: translateX(30px); } }
      .b292-fly { animation: b292fly 3.4s ease-in-out infinite; }
      @keyframes b292fly { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(14px, -6px); } 60% { transform: translate(-8px, 4px); } }
      .b292-glint { animation: b292gl 5s ease-in-out infinite; }
      @keyframes b292gl { 0%, 100% { opacity: .2; } 50% { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { .b292-tw, .b292-mist, .b292-fly, .b292-glint { animation: none; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b292sky)"/>
  <circle cx="700" cy="92" r="70" fill="url(#b292sun)"/>
  <circle cx="700" cy="92" r="20" fill="#FFF1BE"/>
  <path d="M0 98 Q140 80 280 92 T560 86 T820 94 T920 88 V120 H0z" fill="#6E8A5A"/>
