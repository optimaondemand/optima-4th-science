    <path d="M190 96 l4 -34 l4 34z"/><path d="M194 66 q-18 -4 -24 6 q12 -4 24 -2z"/><path d="M194 66 q18 -6 26 2 q-12 -2 -26 2z"/>
    <path d="M846 94 l5 -40 l4 40z"/><path d="M851 58 q-20 -6 -28 6 q14 -6 28 -2z"/><path d="M851 58 q20 -8 30 2 q-14 -4 -30 2z"/>
  </g>
  <rect y="112" width="920" height="88" fill="url(#b292water)"/>
  <path d="M640 120 h120 M660 132 h80 M675 144 h50" stroke="#FFE6A6" stroke-width="3" stroke-linecap="round" class="b292-glint"/>
  <g class="b292-mist" opacity=".55"><ellipse cx="300" cy="118" rx="180" ry="8" fill="#FFFFFF"/><ellipse cx="560" cy="124" rx="140" ry="6" fill="#FFFFFF"/></g>
  <path d="M0 168 Q120 150 260 160 Q380 170 470 158 L520 200 H0z" fill="#C8B48A"/>
  <g fill="#9B8A6A"><ellipse cx="60" cy="182" rx="12" ry="6"/><ellipse cx="420" cy="176" rx="9" ry="5"/><ellipse cx="110" cy="190" rx="7" ry="4"/><ellipse cx="470" cy="188" rx="8" ry="4"/></g>
