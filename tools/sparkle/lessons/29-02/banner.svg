    </g>
    <g fill="#FFFBE3">
      <path class="b292-tw" d="M-10 -20 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/>
      <path class="b292-tw b292-tw2" d="M20 -16 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5z"/>
      <path class="b292-tw b292-tw3" d="M-46 -6 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5z"/>
    </g>
  </g>
  <g transform="translate(560 64)"><g class="b292-fly">
