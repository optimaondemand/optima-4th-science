    <ellipse cx="17" cy="-7" rx="9" ry="3.5" fill="#DDF1F8" opacity=".75" transform="rotate(-12 17 -7)"/>
    <ellipse cx="17" cy="7" rx="9" ry="3.5" fill="#DDF1F8" opacity=".75" transform="rotate(12 17 7)"/>
  </g></g>
</svg>
