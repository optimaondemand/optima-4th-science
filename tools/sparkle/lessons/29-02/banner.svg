    <path d="M-94 -6 Q-80 26 0 28 Q80 26 94 -6 Z" fill="#4A4F54"/>
    <ellipse cx="0" cy="-6" rx="94" ry="22" fill="#8C9298" stroke="#3A3E42" stroke-width="3"/>
    <ellipse cx="0" cy="-4" rx="78" ry="16" fill="#5D6368"/>
    <ellipse cx="0" cy="-2" rx="62" ry="11" fill="#86AEB9"/>
    <path d="M-70 -14 Q0 -22 70 -14" stroke="#C9CED2" stroke-width="2" fill="none" opacity=".7"/>
    <g fill="#8C8577"><ellipse cx="-36" cy="-2" rx="8" ry="4"/><ellipse cx="30" cy="2" rx="7" ry="4"/><ellipse cx="-4" cy="5" rx="6" ry="3"/><ellipse cx="48" cy="-4" rx="5" ry="3"/></g>
    <g fill="#F2C443" stroke="#9C7418" stroke-width="1.4">
