<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dawn at a Florida pond: a dragonfly has just climbed out of its brown nymph skin on a cattail stem, and a green monarch chrysalis hangs under a milkweed leaf beside the water." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="emSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FC3DD"/><stop offset=".55" stop-color="#F6D3B0"/><stop offset="1" stop-color="#F9E7C8"/>
    </linearGradient>
    <linearGradient id="emWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D9D2"/><stop offset=".4" stop-color="#7FA79E"/><stop offset="1" stop-color="#3F6A63"/>
    </linearGradient>
    <radialGradient id="emSun"><stop offset="0" stop-color="#FFF4D6" stop-opacity="1"/><stop offset="1" stop-color="#FFE3B0" stop-opacity="0"/></radialGradient>
    <linearGradient id="emWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#CFE6EE" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="emChrys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FAE6E"/><stop offset=".5" stop-color="#9AD69E"/><stop offset="1" stop-color="#4E9A5E"/>
    </linearGradient>
  </defs>
  <rect width="920" height="200" fill="url(#emSky)"/>
  <circle cx="610" cy="118" r="110" fill="url(#emSun)"/>
  <circle cx="610" cy="118" r="24" fill="#FFF3D2"/>
  <!-- far shore of cypress and pines -->
  <path d="M0,124 Q30,104 60,118 Q80,96 110,114 Q140,100 170,116 Q210,92 250,114 Q290,104 330,118 L330,132 L0,132Z" fill="#7C8F7A" opacity=".8"/>
  <path d="M560,126 Q600,108 640,122 Q690,100 740,120 Q790,106 840,122 Q880,110 920,120 L920,132 L560,132Z" fill="#7C8F7A" opacity=".8"/>
  <path d="M330,126 Q400,118 460,124 Q510,116 560,126 L560,132 L330,132Z" fill="#8FA08B" opacity=".7"/>
  <path d="M0,128 L920,128 L920,134 L0,134Z" fill="#6F8770" opacity=".7"/>
  <!-- pond -->
  <rect x="0" y="132" width="920" height="68" fill="url(#emWater)"/>
  <ellipse cx="610" cy="150" rx="90" ry="5" fill="#FFF3D2" opacity=".45"/>
  <g class="em-shim" stroke="#EAF4F0" stroke-width="1.5" stroke-linecap="round" opacity=".55" fill="none">
    <path d="M60,160 h30"/><path d="M180,175 h40"/><path d="M420,166 h34"/><path d="M560,182 h28"/><path d="M700,170 h36"/><path d="M830,186 h30"/>
  </g>
  <!-- lily pads -->
  <g fill="#4F8B5A">
    <path d="M120,176 a26,7 0 1 0 1,0 l-12,6Z"/><path d="M470,186 a22,6 0 1 0 1,0 l-10,5Z"/><path d="M760,178 a20,5.5 0 1 0 1,0 l-9,4Z"/>
  </g>
  <circle cx="474" cy="183" r="4" fill="#FFFFFF"/><circle cx="474" cy="183" r="2" fill="#F5D46B"/>
  <!-- cattails, left cluster -->
  <g stroke-linecap="round">
    <path d="M70,200 C72,150 68,110 74,70" stroke="#5E8A4A" stroke-width="3" fill="none"/>
    <path d="M92,200 C95,150 98,100 96,48" stroke="#6C9A52" stroke-width="3" fill="none"/>
    <path d="M110,200 C108,160 116,120 126,92" stroke="#5E8A4A" stroke-width="2.5" fill="none"/>
    <path d="M56,200 C52,170 40,130 30,104" stroke="#73A05A" stroke-width="2.5" fill="none"/>
    <rect x="90.5" y="58" width="11" height="40" rx="5.5" fill="#6B4528"/><path d="M96,58 v-14" stroke="#7A6A48" stroke-width="2"/>
    <rect x="69" y="80" width="10" height="34" rx="5" fill="#5E3C22"/><path d="M74,80 v-12" stroke="#7A6A48" stroke-width="2"/>
  </g>
  <!-- main cattail with the emerging dragonfly -->
  <g stroke-linecap="round">
    <path d="M300,200 C302,160 298,110 304,40" stroke="#5E8A4A" stroke-width="4" fill="none"/>
    <path d="M318,200 C322,170 334,130 352,104" stroke="#6C9A52" stroke-width="3" fill="none"/>
    <path d="M284,200 C278,170 266,140 252,120" stroke="#73A05A" stroke-width="3" fill="none"/>
    <rect x="298" y="6" width="12" height="40" rx="6" fill="#6B4528"/><path d="M304,6 v-8" stroke="#7A6A48" stroke-width="2"/>
  </g>
  <!-- the empty nymph skin (exuvia), clinging head-up -->
  <g transform="translate(303,168) scale(1.15)">
    <ellipse cx="0" cy="0" rx="7" ry="16" fill="#8A6235"/>
    <ellipse cx="0" cy="-17" rx="6" ry="5" fill="#8A6235"/>
    <path d="M0,-12 L0,6" stroke="#4E3418" stroke-width="1.6"/>
    <g stroke="#7A532C" stroke-width="2" fill="none">
      <path d="M-5,-6 l-9,-5 l-3,3"/><path d="M5,-6 l9,-5 l3,3"/><path d="M-6,1 l-10,1 l-2,4"/><path d="M6,1 l10,1 l2,4"/><path d="M-5,8 l-8,6"/><path d="M5,8 l8,6"/>
    </g>
  </g>
  <!-- the new adult dragonfly above its skin, wings still folded and glassy -->
  <g transform="translate(304,98) scale(1.6)">
    <path d="M0,-8 L0,32" stroke="#9CC98A" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,10 L0,32" stroke="#BFE0A6" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="0" cy="-10" rx="5" ry="6" fill="#8BBF7B"/>
    <circle cx="-3.5" cy="-14" r="3.2" fill="#3E6E4C"/><circle cx="3.5" cy="-14" r="3.2" fill="#3E6E4C"/>
    <g class="em-wing" fill="url(#emWing)" stroke="#B8D6DF" stroke-width=".8">
      <path d="M-2,-4 C-10,2 -12,18 -8,26 C-5,18 -3,6 -2,-4Z"/><path d="M2,-4 C10,2 12,18 8,26 C5,18 3,6 2,-4Z"/>
      <path d="M-2,0 C-7,8 -8,20 -5,30 C-3,20 -2,10 -2,0Z" opacity=".8"/><path d="M2,0 C7,8 8,20 5,30 C3,20 2,10 2,0Z" opacity=".8"/>
    </g>
  </g>
  <!-- milkweed on the bank, right -->
  <g>
    <path d="M760,200 C760,170 756,140 762,96" stroke="#6E8F55" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M761,150 C740,142 718,146 706,158 C724,162 744,160 761,150Z" fill="#7FA463"/>
    <path d="M761,130 C784,120 808,124 820,136 C800,142 780,140 761,130Z" fill="#88AD69"/>
    <path d="M762,112 C744,100 724,102 712,112 C730,118 748,118 762,112Z" fill="#7FA463"/>
    <path d="M761,150 C740,142 718,146 706,158" stroke="#5E8148" stroke-width="1.2" fill="none"/>
    <path d="M761,130 C784,120 808,124 820,136" stroke="#5E8148" stroke-width="1.2" fill="none"/>
    <g fill="#E7A5B8"><circle cx="762" cy="88" r="5"/><circle cx="754" cy="92" r="4.5"/><circle cx="770" cy="92" r="4.5"/><circle cx="758" cy="83" r="4"/><circle cx="767" cy="83" r="4"/><circle cx="762" cy="78" r="3.5"/></g>
    <g fill="#D9839C"><circle cx="762" cy="88" r="1.8"/><circle cx="754" cy="92" r="1.6"/><circle cx="770" cy="92" r="1.6"/></g>
    <!-- chrysalis hanging under the right leaf -->
    <path d="M796,129 v6" stroke="#2E2A1E" stroke-width="1.4"/>
    <g class="em-chrys">
      <path d="M796,135 C805,137 807,150 803,160 C800,166 792,166 789,160 C785,150 787,137 796,135Z" fill="url(#emChrys)"/>
      <path d="M788.5,145 C793,143.5 799,143.5 803.5,145" stroke="#1F1F1F" stroke-width="1.6" fill="none"/>
      <g fill="#F2C94C"><circle cx="789.5" cy="146" r="1.1"/><circle cx="796" cy="145.2" r="1.1"/><circle cx="802.5" cy="146" r="1.1"/><circle cx="792" cy="157" r="1"/><circle cx="800" cy="157" r="1"/></g>
    </g>
  </g>
  <!-- reeds, right edge -->
  <g stroke="#6C9A52" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M860,200 C862,160 858,130 866,96"/><path d="M880,200 C884,170 892,140 904,120"/><path d="M846,200 C842,176 834,150 824,136"/>
  </g>
  <style>
    .em-shim { animation: emShim 4.5s ease-in-out infinite alternate; }
    @keyframes emShim { from { opacity:.2; transform:translateX(0); } to { opacity:.6; transform:translateX(6px); } }
    .em-wing { animation: emWing 3s ease-in-out infinite alternate; transform-origin: 0px -4px; }
    @keyframes emWing { from { opacity:.65; } to { opacity:1; } }
    .em-chrys { animation: emSway 5s ease-in-out infinite alternate; transform-origin: 796px 135px; }
    @keyframes emSway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .em-shim, .em-wing, .em-chrys { animation: none; } }
  </style>
</svg>
