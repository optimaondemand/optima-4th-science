<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four stations on Sam's lab bench at sunset: a steaming cup with a thermometer, a flashlight shining a spot onto paper, rice jumping on a drum, and a battery lighting a small bulb; through the window, the pier with a new lightning rod">
  <style>
    .b202steam { animation: b202steam 2.4s ease-in-out infinite; }
    .b202steam.s2 { animation-delay:.8s; } .b202steam.s3 { animation-delay:1.6s; }
    .b202rice { animation: b202rice 1.2s ease-in-out infinite; }
    .b202rice.r2 { animation-delay:.15s; } .b202rice.r3 { animation-delay:.3s; }
    .b202glow { animation: b202glow 2.6s ease-in-out infinite; }
    .b202beam { animation: b202beam 3s ease-in-out infinite; }
    .b202ring { fill:none; stroke:#3D5A99; stroke-width:2.5; opacity:0; animation: b202ring 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes b202steam { 0% { opacity:0; transform: translateY(6px); } 40% { opacity:.8; } 100% { opacity:0; transform: translateY(-16px); } }
    @keyframes b202rice { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-16px); } }
    @keyframes b202glow { 50% { opacity:.45; } }
    @keyframes b202beam { 50% { opacity:.6; } }
    @keyframes b202ring { 0% { opacity:.8; transform: scale(.5); } 100% { opacity:0; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) { .b202steam, .b202rice, .b202glow, .b202beam, .b202ring { animation:none; } .b202steam { opacity:.7; } .b202ring { opacity:.5; } }
  </style>
  <defs>
    <linearGradient id="b202wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E7D0"/><stop offset="1" stop-color="#E6D3B0"/></linearGradient>
    <linearGradient id="b202sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B267"/><stop offset=".6" stop-color="#F9D28B"/><stop offset="1" stop-color="#7FB8D8"/></linearGradient>
    <linearGradient id="b202bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9784A"/><stop offset="1" stop-color="#7E5530"/></linearGradient>
    <radialGradient id="b202bulb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF7C2"/><stop offset="1" stop-color="#FFD54A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="920" height="200" fill="url(#b202wall)"/>
  <!-- the window: sunset over the Gulf, the pier and its new lightning rod -->
  <g>
    <rect x="610" y="14" width="280" height="112" rx="6" fill="url(#b202sky)" stroke="#8A6A44" stroke-width="6"/>
    <circle cx="790" cy="78" r="16" fill="#FFE29A"/>
    <rect x="613" y="92" width="274" height="31" fill="#4E93BF"/>
    <g stroke="#5B4430" stroke-width="3"><line x1="640" y1="98" x2="860" y2="98"/><line x1="660" y1="98" x2="660" y2="118"/><line x1="720" y1="98" x2="720" y2="118"/><line x1="780" y1="98" x2="780" y2="118"/><line x1="840" y1="98" x2="840" y2="118"/></g>
    <line x1="812" y1="98" x2="812" y2="60" stroke="#3B3B3B" stroke-width="3"/><circle cx="812" cy="58" r="4" fill="#FFE066"/>
    <line x1="812" y1="54" x2="812" y2="36" stroke="#B87333" stroke-width="2.5"/><circle cx="812" cy="35" r="2" fill="#B87333"/>
    <line x1="750" y1="14" x2="750" y2="126" stroke="#8A6A44" stroke-width="4"/>
  </g>
  <!-- the bench -->
  <rect x="0" y="150" width="920" height="16" fill="url(#b202bench)"/><rect x="0" y="166" width="920" height="34" fill="#6A4628"/>
  <!-- heat station: warm cup + thermometer -->
  <g>
    <path d="M60 106 h50 l-5 44 h-40 z" fill="#FBF6EC" stroke="#9FB7C8" stroke-width="2.5"/><path d="M64 116 h42 l-4 32 h-34z" fill="#F2B98A"/>
    <path d="M110 116 q14 0 14 12 q0 12 -16 12" fill="none" stroke="#9FB7C8" stroke-width="3"/>
    <rect x="92" y="62" width="9" height="78" rx="4.5" fill="#fff" stroke="#8A9AA8" stroke-width="1.5" transform="rotate(10 96 100)"/>
    <rect x="94" y="96" width="5" height="42" rx="2.5" fill="#E8636B" transform="rotate(10 96 100)"/>
    <g stroke="#C9C1B4" stroke-width="3" fill="none" stroke-linecap="round"><path class="b202steam" d="M72 100 q-5 -8 0 -16 t0 -16"/><path class="b202steam s2" d="M84 100 q-5 -8 0 -16 t0 -16"/><path class="b202steam s3" d="M96 98 q-5 -8 0 -16"/></g>
  </g>
  <!-- light station: flashlight + beam + spot on paper -->
  <g>
    <g transform="rotate(-8 205 132)"><rect x="170" y="124" width="46" height="18" rx="5" fill="#2E3A4A"/><path d="M216 120 h12 v26 h-12 z" fill="#4A5868"/></g>
    <path class="b202beam" d="M228 120 L318 92 L318 152 L228 140 Z" fill="#FFF0A8" opacity=".85"/>
    <rect x="318" y="84" width="8" height="66" fill="#fff" stroke="#C9D6E0" stroke-width="1.5"/>
    <ellipse cx="320" cy="122" rx="4" ry="22" fill="#FFE066"/>
  </g>
  <!-- sound station: drum + jumping rice + sound rings -->
  <g>
    <ellipse cx="450" cy="126" rx="48" ry="10" fill="#F3E9D2" stroke="#C8B48A" stroke-width="2"/>
    <rect x="402" y="126" width="96" height="24" fill="#C8453D"/><ellipse cx="450" cy="150" rx="48" ry="9" fill="#A8352F"/>
    <path d="M408 130 l12 18 l12 -18 l12 18 l12 -18 l12 18 l12 -18 l12 18" fill="none" stroke="#F3E9D2" stroke-width="2"/>
    <g fill="#fff" stroke="#BBB"><ellipse class="b202rice" cx="432" cy="118" rx="4.5" ry="2.4"/><ellipse class="b202rice r2" cx="452" cy="116" rx="4.5" ry="2.4"/><ellipse class="b202rice r3" cx="468" cy="119" rx="4.5" ry="2.4"/></g>
    <g transform="translate(450 100)"><circle class="b202ring" r="20"/><circle class="b202ring" r="20" style="animation-delay:.6s"/></g>
  </g>
  <!-- electrical station: battery + wires + glowing bulb -->
  <g>
    <rect x="530" y="128" width="46" height="20" rx="4" fill="#2E3A4A"/><rect x="576" y="133" width="5" height="10" fill="#B9C2CC"/><rect x="530" y="128" width="14" height="20" rx="3" fill="#D99A00"/>
    <circle class="b202glow" cx="590" cy="96" r="26" fill="url(#b202bulb)"/>
    <circle cx="590" cy="96" r="11" fill="#FFE066" stroke="#E0A100" stroke-width="2"/><rect x="584" y="106" width="12" height="9" fill="#9AA5B1"/>
    <path d="M581 138 C600 138 600 120 594 115 M530 138 C512 138 512 112 586 112" fill="none" stroke="#C0392B" stroke-width="2.5"/>
  </g>
</svg>
