<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One beach, four paths: sunlight reaching the sand, sound rings rolling out of a band shell, heat shimmering off a grill, and a power line carrying electricity to a lifeguard tower, with palm trees and a brown pelican on a post">
  <style>
    .b201ray { animation: b201ray 2.6s ease-in-out infinite; }
    .b201ring { fill:none; stroke:#3D5A99; stroke-width:3; opacity:0; animation: b201ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .b201ring.r2 { animation-delay:.8s; } .b201ring.r3 { animation-delay:1.6s; }
    .b201heat { animation: b201heat 1.8s ease-in-out infinite; }
    .b201heat.h2 { animation-delay:.6s; } .b201heat.h3 { animation-delay:1.2s; }
    .b201spark { animation: b201spark 2.2s linear infinite; }
    .b201wave { animation: b201wave 6s ease-in-out infinite; }
    .b201lamp { animation: b201lamp 2.2s ease-in-out infinite; }
    @keyframes b201ray { 50% { opacity:.45; } }
    @keyframes b201ring { 0% { opacity:.9; transform: scale(.4); } 100% { opacity:0; transform: scale(1.6); } }
    @keyframes b201heat { 0% { opacity:0; transform: translateY(6px); } 40% { opacity:.8; } 100% { opacity:0; transform: translateY(-14px); } }
    @keyframes b201spark { 0% { offset-distance:0%; opacity:0; } 8% { opacity:1; } 92% { opacity:1; } 100% { offset-distance:100%; opacity:0; } }
    @keyframes b201wave { 50% { transform: translateX(12px); } }
    @keyframes b201lamp { 50% { opacity:.55; } }
    @media (prefers-reduced-motion: reduce) { .b201ray, .b201ring, .b201heat, .b201spark, .b201wave, .b201lamp { animation:none; } .b201ring { opacity:.5; } .b201heat { opacity:.7; } .b201spark { offset-distance:55%; opacity:1; } }
  </style>
  <defs>
    <linearGradient id="b201sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC8EE"/><stop offset="1" stop-color="#E4F5FC"/></linearGradient>
    <linearGradient id="b201sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FA0C8"/><stop offset="1" stop-color="#2A7EA6"/></linearGradient>
    <linearGradient id="b201sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5E3B0"/><stop offset="1" stop-color="#E4C47F"/></linearGradient>
    <radialGradient id="b201sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".6" stop-color="#FFD54A"/><stop offset="1" stop-color="#FFC233"/></radialGradient>
  </defs>
  <rect width="920" height="200" fill="url(#b201sky)"/>
  <!-- the Sun, and light reaching the sand -->
  <circle cx="92" cy="40" r="26" fill="url(#b201sun)"/>
  <g stroke="#FFD54A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">
    <line class="b201ray" x1="110" y1="62" x2="168" y2="150"/>
    <line class="b201ray" x1="98" y1="68" x2="120" y2="156" style="animation-delay:.5s"/>
    <line class="b201ray" x1="118" y1="56" x2="214" y2="146" style="animation-delay:1s"/>
  </g>
  <rect x="0" y="112" width="920" height="30" fill="url(#b201sea)"/>
  <g stroke="#CDEBF7" stroke-width="2" fill="none" opacity=".7"><g class="b201wave"><path d="M300 122 q14 -4 28 0 t28 0"/><path d="M520 130 q14 -4 28 0 t28 0"/><path d="M700 121 q14 -4 28 0 t28 0"/></g></g>
  <path d="M0 140 Q230 130 460 138 T920 136 L920 200 L0 200 Z" fill="url(#b201sand)"/>
  <ellipse cx="170" cy="156" rx="46" ry="7" fill="#FFF2C4" opacity=".9"/>
  <!-- palm trees -->
  <g><path d="M38 182 Q34 140 46 108" stroke="#8A6A44" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#3E8E4E"><path d="M46 108 Q20 96 6 110 Q26 100 46 110Z"/><path d="M46 108 Q66 90 88 98 Q66 98 46 110Z"/><path d="M46 108 Q40 84 54 74 Q48 92 47 108Z"/><path d="M46 108 Q74 108 84 124 Q66 112 46 110Z"/></g></g>
  <g><path d="M884 184 Q890 150 878 120" stroke="#8A6A44" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g fill="#3E8E4E"><path d="M878 120 Q852 110 840 124 Q858 114 878 122Z"/><path d="M878 120 Q898 104 918 112 Q898 112 878 122Z"/><path d="M878 120 Q872 98 886 88 Q880 106 879 120Z"/></g></g>
  <!-- the band shell, and sound rings rolling out -->
  <g>
    <path d="M300 176 L300 128 A44 44 0 0 1 388 128 L388 176 Z" fill="#F7F1E3" stroke="#B9A57A" stroke-width="2"/>
    <path d="M310 176 L310 132 A34 34 0 0 1 378 132 L378 176 Z" fill="#D9C79E"/>
    <g transform="translate(344 160)"><ellipse rx="14" ry="6" fill="#E8636B"/><rect x="-14" y="0" width="28" height="12" fill="#C8453D"/><ellipse cy="12" rx="14" ry="6" fill="#A8352F"/></g>
    <g transform="translate(398 140)"><circle class="b201ring" r="14"/><circle class="b201ring r2" r="14"/><circle class="b201ring r3" r="14"/></g>
  </g>
  <!-- the grill, and heat shimmering up -->
  <g>
    <path d="M500 150 h56 a28 18 0 0 1 -56 0 Z" fill="#2E3A4A"/>
    <line x1="508" y1="164" x2="500" y2="184" stroke="#2E3A4A" stroke-width="4"/><line x1="548" y1="164" x2="556" y2="184" stroke="#2E3A4A" stroke-width="4"/>
    <rect x="502" y="146" width="52" height="5" rx="2" fill="#E8636B"/>
    <g stroke="#FF8A4D" stroke-width="3" fill="none" stroke-linecap="round">
      <path class="b201heat" d="M512 140 q-5 -8 0 -16 t0 -16"/><path class="b201heat h2" d="M528 140 q-5 -8 0 -16 t0 -16"/><path class="b201heat h3" d="M544 140 q-5 -8 0 -16 t0 -16"/>
    </g>
  </g>
  <!-- the power line to the lifeguard tower -->
  <g>
    <rect x="640" y="88" width="6" height="92" fill="#7A5A3A"/><rect x="628" y="92" width="30" height="4" fill="#7A5A3A"/>
    <path id="b201wire" d="M656 94 Q700 116 744 110" stroke="#2B2F36" stroke-width="2.5" fill="none"/>
    <circle class="b201spark" r="4" fill="#B48CFF" style="offset-path: path('M656 94 Q700 116 744 110');"/>
    <g>
      <rect x="738" y="104" width="52" height="34" fill="#E8636B" stroke="#A8352F" stroke-width="2"/>
      <path d="M732 104 L764 86 L796 104 Z" fill="#F7F1E3" stroke="#B9A57A" stroke-width="2"/>
      <rect x="746" y="112" width="16" height="12" fill="#BFE6F7"/>
      <circle class="b201lamp" cx="782" cy="112" r="5" fill="#FFE066"/>
      <line x1="742" y1="138" x2="736" y2="184" stroke="#8A6A44" stroke-width="4"/><line x1="786" y1="138" x2="792" y2="184" stroke="#8A6A44" stroke-width="4"/>
      <line x1="740" y1="160" x2="788" y2="160" stroke="#8A6A44" stroke-width="3"/>
    </g>
  </g>
  <!-- a brown pelican on a post, watching -->
  <rect x="826" y="134" width="11" height="50" fill="#7A5A3A"/>
  <g transform="translate(831 134)">
    <ellipse cx="0" cy="-14" rx="16" ry="11" fill="#7E6B57"/>
    <path d="M-16 -14 Q-27 -5 -21 4 L-5 -5 Z" fill="#5A4A3A"/>
    <path d="M5 -22 Q9 -36 3 -43" stroke="#6B4A2E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="3" cy="-45" rx="7" ry="6" fill="#F4EBD3"/>
    <circle cx="5" cy="-47" r="1.5" fill="#1A1A1A"/>
    <path d="M9 -47 L38 -41 L38 -39 L9 -42 Z" fill="#C9A55A"/>
    <path d="M10 -42 Q24 -35 37 -39 Z" fill="#9C7A3E"/>
  </g>
</svg>
