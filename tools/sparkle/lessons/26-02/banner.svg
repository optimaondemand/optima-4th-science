<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Palmetto Creek at sunset, bending around a grassy marsh. On a little dock at the left, a flashlight sends a beam across the water, blinking short and long flashes toward a dock on the far bank. A yellow rubber duck drifts with the current. Cypress trees and palmettos line the shore.">
  <defs>
    <linearGradient id="b262sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3F7A"/><stop offset=".45" stop-color="#B86A8A"/><stop offset=".8" stop-color="#F2A56B"/><stop offset="1" stop-color="#F7CF8A"/></linearGradient>
    <linearGradient id="b262water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6C7FB0"/><stop offset="1" stop-color="#3A4C7E"/></linearGradient>
    <linearGradient id="b262beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6C2" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6C2" stop-opacity="0"/></linearGradient>
    <style>
      .b262-beam { animation: b262code 6s steps(1,end) infinite; opacity: 0; }
      @keyframes b262code { 0% { opacity: .9; } 5% { opacity: 0; } 10% { opacity: .9; } 15% { opacity: 0; } 22% { opacity: .9; } 40% { opacity: 0; } 47% { opacity: .9; } 65% { opacity: 0; } 100% { opacity: 0; } }
      .b262-drift { animation: b262drift 14s ease-in-out infinite alternate; }
      @keyframes b262drift { 0% { transform: translate(0px,0px); } 50% { transform: translate(34px,3px); } 100% { transform: translate(68px,0px); } }
      .b262-bob { animation: b262bob 2.6s ease-in-out infinite; }
      @keyframes b262bob { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(0px,-3px); } }
      .b262-fly { animation: b262tw 3.4s ease-in-out infinite; } .b262-fly2 { animation: b262tw 4.1s ease-in-out infinite; animation-delay: 1.2s; }
      @keyframes b262tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .b262-beam, .b262-drift, .b262-bob, .b262-fly, .b262-fly2 { animation: none; } .b262-beam { opacity: .75; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b262sky)"/>
  <circle cx="700" cy="104" r="34" fill="#FFD27A"/><circle cx="700" cy="104" r="52" fill="#FFD27A" opacity=".3"/>
  <circle cx="120" cy="26" r="1.6" fill="#fff"/><circle cx="260" cy="16" r="1.3" fill="#fff"/><circle cx="420" cy="30" r="1.5" fill="#fff"/>
  <!-- far shore: cypress and palmettos -->
  <path d="M0 112 Q 140 100 280 108 T 560 104 T 920 106 L920 126 L0 126 Z" fill="#3E5A44"/>
  <g fill="#2C4434">
    <path d="M40 110 l9 -54 l9 54 z"/><path d="M32 112 q17 -34 34 0z"/>
    <path d="M110 108 l7 -40 l7 40 z"/><path d="M104 110 q13 -26 26 0z"/>
    <path d="M820 108 l8 -50 l8 50 z"/><path d="M812 110 q16 -32 32 0z"/>
    <path d="M880 108 l6 -36 l6 36 z"/>
  </g>
  <g fill="#2F4A37">
    <path d="M560 106 l0 -28 M560 78 q-16 -4 -24 6 M560 78 q16 -4 24 6 M560 78 q-6 -14 -18 -16 M560 78 q6 -14 18 -16" stroke="#2F4A37" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M640 106 l0 -22 M640 84 q-14 -4 -20 5 M640 84 q14 -4 20 5 M640 84 q-5 -12 -15 -13 M640 84 q5 -12 15 -13" stroke="#2F4A37" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- the creek bending around the marsh -->
  <path d="M0 200 L0 150 C 160 130 260 112 420 118 S 700 150 920 140 L920 200 Z" fill="url(#b262water)"/>
  <path d="M300 200 C 380 168 480 150 600 160 S 760 186 820 200 Z" fill="#7C8F4E"/>
  <g stroke="#A4B562" stroke-width="2.5" stroke-linecap="round">
    <path d="M420 190 l-5 -14 M420 190 l0 -17 M420 190 l5 -14"/><path d="M500 182 l-5 -14 M500 182 l0 -17 M500 182 l5 -14"/>
    <path d="M580 176 l-5 -14 M580 176 l0 -17 M580 176 l5 -14"/><path d="M660 184 l-5 -14 M660 184 l0 -17 M660 184 l5 -14"/><path d="M740 192 l-5 -14 M740 192 l0 -17 M740 192 l5 -14"/>
  </g>
  <g stroke="#E8D9F0" stroke-width="2" opacity=".55"><path d="M60 168 l26 0 M140 158 l18 0 M230 150 l22 0 M780 160 l20 0 M860 156 l16 0"/></g>
  <circle class="b262-fly" cx="470" cy="160" r="2.2" fill="#FFF59A"/><circle class="b262-fly2" cx="610" cy="150" r="2" fill="#FFF59A"/>
  <!-- the start dock with the flashlight, beam crossing toward the far dock -->
  <path class="b262-beam" d="M118 140 L860 112 L860 136 Z" fill="url(#b262beam)"/>
  <rect x="40" y="148" width="96" height="9" rx="2" fill="#6B4A2B"/><rect x="48" y="157" width="6" height="30" fill="#5A3D22"/><rect x="124" y="157" width="6" height="30" fill="#5A3D22"/>
  <g transform="translate(92 132)"><rect x="0" y="0" width="22" height="13" rx="4" fill="#2D3A4A"/><path d="M22 -2 L30 -5 L30 18 L22 15 Z" fill="#3E4E62"/><circle cx="29" cy="6.5" r="4" fill="#FFF3A8"/></g>
  <!-- the far dock -->
  <rect x="842" y="128" width="70" height="7" rx="2" fill="#6B4A2B"/><rect x="852" y="135" width="5" height="18" fill="#5A3D22"/><rect x="900" y="135" width="5" height="18" fill="#5A3D22"/>
  <!-- the duck drifting with the current -->
  <g transform="translate(250 160)"><g class="b262-drift"><g class="b262-bob">
    <ellipse cx="0" cy="8" rx="24" ry="5" fill="#26365E" opacity=".45"/>
    <path d="M-22 -2 Q -24 10 -5 12 L 14 12 Q 26 10 24 -1 Q 14 4 5 0 Q -8 -8 -22 -2 Z" fill="#F7D232" stroke="#B88A00" stroke-width="2"/>
    <circle cx="13" cy="-11" r="10" fill="#F7D232" stroke="#B88A00" stroke-width="2"/>
    <path d="M21 -12 l11 3 l-11 3 z" fill="#F08A1C" stroke="#B85F0A" stroke-width="1"/>
    <circle cx="15" cy="-14" r="1.9" fill="#1C2733"/>
  </g></g></g>
</svg>
