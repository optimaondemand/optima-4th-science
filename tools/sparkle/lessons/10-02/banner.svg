<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Looking down from a survey plane at a clear Florida spring run: manatees rest in turquoise water over seagrass, oak trees line both banks, and the plane's shadow slides across the water." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bwWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA7B8"/><stop offset=".5" stop-color="#45C4CF"/><stop offset="1" stop-color="#2B98AE"/>
    </linearGradient>
    <linearGradient id="bwBank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5A2C"/><stop offset="1" stop-color="#1F4020"/>
    </linearGradient>
    <radialGradient id="bwBoil"><stop offset="0" stop-color="#A9F0F0" stop-opacity=".95"/><stop offset=".6" stop-color="#6FD8DC" stop-opacity=".5"/><stop offset="1" stop-color="#45C4CF" stop-opacity="0"/></radialGradient>
    <radialGradient id="bwCrown"><stop offset="0" stop-color="#5E8F45"/><stop offset=".7" stop-color="#3F6E31"/><stop offset="1" stop-color="#2C5225"/></radialGradient>
    <filter id="bwSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <symbol id="bwMan" viewBox="-46 -16 92 32">
      <!-- a manatee seen from above: wide round paddle tail (left), chunky body, two flippers near the head, blunt snout (right) -->
      <path d="M-30,0 C-36,-3 -44,-13 -38,-15 C-30,-16 -26,-8 -22,-6 Z M-30,0 C-36,3 -44,13 -38,15 C-30,16 -26,8 -22,6 Z" fill="#66767A"/>
      <ellipse cx="-36" cy="0" rx="7" ry="14" fill="#6A7A7E"/>
      <ellipse cx="18" cy="-11" rx="7" ry="3" fill="#5D6C70" transform="rotate(-35 18 -11)"/>
      <ellipse cx="18" cy="11" rx="7" ry="3" fill="#5D6C70" transform="rotate(35 18 11)"/>
      <path d="M-32,0 C-32,-8 -24,-12 -12,-12 C4,-12 18,-10 28,-6 C36,-3 40,-2 40,0 C40,2 36,3 28,6 C18,10 4,12 -12,12 C-24,12 -32,8 -32,0Z" fill="#7D8C8F"/>
      <path d="M-24,-5 C-6,-8 12,-6 30,-2" stroke="#97A6A8" stroke-width="2.2" fill="none" opacity=".75"/>
      <ellipse cx="39" cy="0" rx="5" ry="5.4" fill="#8A999C"/>
      <circle cx="42" cy="-2" r=".9" fill="#3E4A4D"/><circle cx="42" cy="2" r=".9" fill="#3E4A4D"/>
    </symbol>
  </defs>

  <!-- banks -->
  <rect width="920" height="200" fill="url(#bwBank)"/>
  <!-- spring run (water) -->
  <path d="M0,58 C120,44 210,70 330,64 C450,58 520,40 640,50 C740,58 830,46 920,52 L920,150 C830,142 750,160 640,152 C520,144 450,166 330,158 C210,150 120,170 0,154Z" fill="url(#bwWater)"/>
  <!-- sandy shallows along the edges -->
  <path d="M0,58 C120,44 210,70 330,64 C450,58 520,40 640,50 C740,58 830,46 920,52 L920,62 C830,56 740,68 640,60 C520,50 450,68 330,74 C210,80 120,54 0,68Z" fill="#E7D9AE" opacity=".55"/>
  <path d="M0,154 C120,170 210,150 330,158 C450,166 520,144 640,152 C750,160 830,142 920,150 L920,140 C830,132 750,150 640,142 C520,134 450,156 330,148 C210,140 120,160 0,144Z" fill="#E7D9AE" opacity=".5"/>
  <!-- the spring boil (the source) -->
  <circle cx="84" cy="104" r="36" fill="url(#bwBoil)"/>
  <circle class="bw-ring" cx="84" cy="104" r="12" fill="none" stroke="#D8FAFA" stroke-width="1.5" opacity=".7"/>

  <!-- seagrass beds -->
  <g stroke="#2F7D45" stroke-width="2" stroke-linecap="round" opacity=".6" fill="none"><path d="M243,81 q10,3 19,0"/><path d="M258,76 q10,-3 19,0"/><path d="M229,84 q13,3 26,0"/><path d="M231,79 q13,3 26,0"/><path d="M245,77 q16,-3 31,0"/><path d="M244,78 q16,-3 32,0"/><path d="M269,80 q15,3 30,0"/><path d="M240,77 q11,3 22,0"/><path d="M268,83 q10,3 19,0"/><path d="M260,132 q13,-3 26,0"/><path d="M229,127 q12,3 25,0"/><path d="M223,137 q16,3 31,0"/><path d="M218,129 q14,3 27,0"/><path d="M250,126 q12,3 24,0"/><path d="M256,129 q12,3 24,0"/><path d="M228,127 q11,3 22,0"/><path d="M220,122 q9,3 18,0"/><path d="M258,128 q13,3 26,0"/><path d="M472,128 q10,-3 20,0"/><path d="M432,131 q16,-3 32,0"/><path d="M468,138 q12,3 25,0"/><path d="M439,129 q12,3 24,0"/><path d="M468,135 q10,3 21,0"/><path d="M434,119 q14,-3 29,0"/><path d="M445,136 q14,-3 27,0"/><path d="M435,128 q16,-3 32,0"/><path d="M446,132 q9,-3 18,0"/><path d="M470,64 q16,3 32,0"/><path d="M491,72 q9,3 18,0"/><path d="M466,72 q10,3 20,0"/><path d="M487,64 q11,-3 22,0"/><path d="M476,71 q10,3 20,0"/><path d="M472,81 q10,3 20,0"/><path d="M484,62 q12,-3 23,0"/><path d="M477,67 q12,3 23,0"/><path d="M466,80 q10,3 19,0"/><path d="M651,87 q16,-3 32,0"/><path d="M645,75 q9,-3 18,0"/><path d="M648,93 q14,-3 28,0"/><path d="M676,75 q13,3 26,0"/><path d="M675,81 q12,-3 23,0"/><path d="M645,90 q11,3 22,0"/><path d="M679,80 q12,-3 25,0"/><path d="M653,88 q12,3 24,0"/><path d="M640,81 q12,3 24,0"/><path d="M633,142 q16,3 32,0"/><path d="M631,137 q10,-3 21,0"/><path d="M620,130 q11,-3 22,0"/><path d="M651,128 q15,-3 30,0"/><path d="M644,130 q10,3 20,0"/><path d="M621,132 q14,-3 27,0"/><path d="M654,134 q16,-3 32,0"/><path d="M649,134 q10,3 19,0"/><path d="M631,140 q16,-3 32,0"/><path d="M829,119 q14,3 28,0"/><path d="M849,120 q16,3 31,0"/><path d="M841,116 q14,3 28,0"/><path d="M829,122 q12,-3 25,0"/><path d="M825,130 q14,-3 28,0"/><path d="M810,122 q16,-3 32,0"/><path d="M825,111 q16,-3 31,0"/><path d="M852,130 q12,3 25,0"/><path d="M833,122 q10,-3 21,0"/><path d="M851,69 q9,3 18,0"/><path d="M845,76 q15,3 30,0"/><path d="M852,81 q9,-3 18,0"/><path d="M848,83 q12,3 23,0"/><path d="M871,78 q9,-3 18,0"/><path d="M840,83 q10,3 19,0"/><path d="M873,72 q14,-3 27,0"/><path d="M840,75 q10,-3 19,0"/><path d="M857,75 q16,-3 31,0"/></g>

  <!-- manatees, resting and grazing -->
  <g class="bw-mans">
    <use href="#bwMan" x="128" y="84" width="96" height="33" transform="rotate(-8 176 100)"/>
    <use href="#bwMan" x="150" y="114" width="72" height="25" transform="rotate(6 186 126)"/>
    <use href="#bwMan" x="300" y="90" width="104" height="36" transform="rotate(4 352 108)"/>
    <use href="#bwMan" x="520" y="70" width="90" height="31" transform="rotate(-10 565 86)"/>
    <use href="#bwMan" x="540" y="110" width="64" height="22" transform="rotate(-4 572 121)"/>
    <use href="#bwMan" x="720" y="94" width="100" height="35" transform="rotate(8 770 112)"/>
  </g>
  <!-- light ripples -->
  <g class="bw-glint" stroke="#E9FFFF" stroke-width="1.4" stroke-linecap="round" opacity=".5" fill="none">
    <path d="M260,76 q8,-3 16,0"/><path d="M390,140 q8,-3 16,0"/><path d="M590,70 q8,-3 16,0"/><path d="M760,138 q8,-3 16,0"/><path d="M860,84 q8,-3 16,0"/>
  </g>

  <!-- oak canopy along the banks (seen from above) -->
  <g><circle cx="190" cy="8" r="22" fill="url(#bwCrown)"/><circle cx="350" cy="6" r="24" fill="url(#bwCrown)"/><circle cx="470" cy="26" r="22" fill="url(#bwCrown)"/><circle cx="500" cy="4" r="22" fill="url(#bwCrown)"/><circle cx="660" cy="6" r="24" fill="url(#bwCrown)"/><circle cx="780" cy="28" r="22" fill="url(#bwCrown)"/><circle cx="800" cy="4" r="22" fill="url(#bwCrown)"/><circle cx="910" cy="30" r="20" fill="url(#bwCrown)"/><circle cx="80" cy="40" r="16" fill="url(#bwCrown)"/><circle cx="80" cy="176" r="22" fill="url(#bwCrown)"/><circle cx="270" cy="184" r="24" fill="url(#bwCrown)"/><circle cx="420" cy="190" r="26" fill="url(#bwCrown)"/><circle cx="580" cy="178" r="24" fill="url(#bwCrown)"/><circle cx="720" cy="192" r="22" fill="url(#bwCrown)"/><circle cx="840" cy="180" r="22" fill="url(#bwCrown)"/><circle cx="230" cy="196" r="18" fill="url(#bwCrown)"/>
    <circle cx="20" cy="22" r="30" fill="url(#bwCrown)"/><circle cx="70" cy="12" r="26" fill="url(#bwCrown)"/><circle cx="130" cy="20" r="30" fill="url(#bwCrown)"/>
    <circle cx="250" cy="14" r="28" fill="url(#bwCrown)"/><circle cx="300" cy="30" r="22" fill="url(#bwCrown)"/><circle cx="410" cy="16" r="30" fill="url(#bwCrown)"/>
    <circle cx="560" cy="10" r="26" fill="url(#bwCrown)"/><circle cx="610" cy="22" r="20" fill="url(#bwCrown)"/><circle cx="720" cy="18" r="30" fill="url(#bwCrown)"/>
    <circle cx="860" cy="14" r="30" fill="url(#bwCrown)"/>
    <circle cx="10" cy="184" r="28" fill="url(#bwCrown)"/><circle cx="160" cy="190" r="30" fill="url(#bwCrown)"/><circle cx="214" cy="176" r="20" fill="url(#bwCrown)"/>
    <circle cx="350" cy="188" r="28" fill="url(#bwCrown)"/><circle cx="500" cy="184" r="30" fill="url(#bwCrown)"/><circle cx="660" cy="190" r="26" fill="url(#bwCrown)"/>
    <circle cx="780" cy="182" r="30" fill="url(#bwCrown)"/><circle cx="900" cy="188" r="26" fill="url(#bwCrown)"/>
  </g>
  <g fill="#7FAF5C" opacity=".35">
    <circle cx="12" cy="14" r="10"/><circle cx="124" cy="12" r="10"/><circle cx="404" cy="8" r="10"/><circle cx="714" cy="10" r="10"/><circle cx="854" cy="6" r="10"/>
    <circle cx="154" cy="182" r="10"/><circle cx="494" cy="176" r="10"/><circle cx="774" cy="174" r="10"/>
  </g>

  <!-- the survey plane's shadow sliding across -->
  <g class="bw-plane" opacity=".28" filter="url(#bwSoft)">
    <path d="M0,-3 L46,-3 L50,0 L46,3 L0,3Z M14,-30 L24,-30 L28,-3 L28,3 L24,30 L14,30 L18,3 L18,-3Z M2,-10 L8,-10 L8,10 L2,10Z" fill="#06202A" transform="translate(560 98) rotate(-6)"/>
  </g>

  <style>
    .bw-plane { animation: bwFly 14s linear -6s infinite; }
    @keyframes bwFly { from { transform: translateX(-640px); } to { transform: translateX(420px); } }
    .bw-ring { animation: bwRing 3.6s ease-out infinite; transform-origin: 84px 104px; }
    @keyframes bwRing { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
    .bw-glint { animation: bwGlint 5s ease-in-out infinite alternate; }
    @keyframes bwGlint { from { opacity: .2; } to { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .bw-plane, .bw-ring, .bw-glint { animation: none; } }
  </style>
</svg>
