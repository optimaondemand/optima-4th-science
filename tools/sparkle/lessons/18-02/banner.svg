<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Hubble Space Telescope floating in black space high above Earth's curved blue edge, with the Florida peninsula below at sunrise.">
  <defs>
    <radialGradient id="b182sky" cx="70%" cy="120%" r="110%"><stop offset="0" stop-color="#16285A"/><stop offset=".55" stop-color="#070D22"/><stop offset="1" stop-color="#02040C"/></radialGradient>
    <linearGradient id="b182sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E78B8"/><stop offset=".5" stop-color="#1A4F8A"/><stop offset="1" stop-color="#0F2F5E"/></linearGradient>
    <linearGradient id="b182sun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0"/><stop offset=".8" stop-color="#FFD27A" stop-opacity=".25"/><stop offset="1" stop-color="#FFB34D" stop-opacity=".6"/></linearGradient>
    <linearGradient id="b182tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F7"/><stop offset=".45" stop-color="#C9CED6"/><stop offset="1" stop-color="#8C939E"/></linearGradient>
    <linearGradient id="b182panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5BA0"/><stop offset="1" stop-color="#1F3570"/></linearGradient>
    <linearGradient id="b182land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E9C52"/><stop offset="1" stop-color="#3F7A3C"/></linearGradient>
    <clipPath id="b182earth"><path d="M-20,200 L-20,168 Q460,96 940,150 L940,200Z"/></clipPath>
    <style>
      .b182tw { animation: b182tw 3.6s ease-in-out infinite; }
      .b182tw2 { animation: b182tw 4.8s 1.2s ease-in-out infinite; }
      .b182drift { animation: b182drift 14s ease-in-out infinite alternate; }
      .b182glint { animation: b182glint 5s ease-in-out infinite; }
      .b182cloud { animation: b182cloud 30s linear infinite; }
      @keyframes b182tw { 50% { opacity:.25; } }
      @keyframes b182drift { to { transform: translate(14px, -4px) rotate(-1.5deg); } }
      @keyframes b182glint { 0%, 70%, 100% { opacity:0; } 80% { opacity:.95; } }
      @keyframes b182cloud { to { transform: translateX(-60px); } }
      @media (prefers-reduced-motion: reduce) { .b182tw, .b182tw2, .b182drift, .b182glint, .b182cloud { animation:none; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b182sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="40" cy="22" r="1.2"/><circle cx="96" cy="58" r=".9"/><circle cx="150" cy="18" r="1.5" class="b182tw"/><circle cx="210" cy="72" r=".8"/>
    <circle cx="262" cy="34" r="1.1"/><circle cx="330" cy="14" r=".9"/><circle cx="388" cy="52" r="1.3" class="b182tw2"/><circle cx="452" cy="24" r=".8"/>
    <circle cx="506" cy="64" r="1"/><circle cx="560" cy="16" r="1.4"/><circle cx="612" cy="44" r=".8"/><circle cx="668" cy="22" r="1.1" class="b182tw"/>
