<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same Florida pond in January: brown winter cattails, a flock of ducks landing on open water, a robin eating red holly berries on the bank, and a manatee resting in the clear, warm spring run.">
  <style>
    .wd-bob { animation: wdBob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .wd-bob2 { animation: wdBob 3.8s ease-in-out infinite .6s; transform-box: fill-box; transform-origin: center; }
    .wd-land { animation: wdLand 7s ease-in-out infinite; }
    .wd-shim { animation: wdShim 4s ease-in-out infinite; }
    .wd-breath { animation: wdBreath 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wdBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
    @keyframes wdLand { 0% { transform: translate(0,0); } 50% { transform: translate(-14px,6px); } 100% { transform: translate(0,0); } }
    @keyframes wdShim { 0%,100% { opacity:.35; } 50% { opacity:.7; } }
    @keyframes wdBreath { 0%,100% { transform: scale(1); opacity:.6; } 50% { transform: scale(1.5); opacity:0; } }
  </style>
  <defs>
    <linearGradient id="wdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB9DA"/><stop offset=".6" stop-color="#CFE2EE"/><stop offset="1" stop-color="#EDF3F2"/>
    </linearGradient>
    <linearGradient id="wdWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9D0D2"/><stop offset=".45" stop-color="#7E9FA2"/><stop offset="1" stop-color="#4C6C6D"/>
    </linearGradient>
    <linearGradient id="wdSpring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE0E0"/><stop offset="1" stop-color="#2F9AA6"/>
    </linearGradient>
    <radialGradient id="wdSun"><stop offset="0" stop-color="#FFFBEA" stop-opacity="1"/><stop offset="1" stop-color="#FFFBEA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="920" height="200" fill="url(#wdSky)"/>
  <circle cx="640" cy="44" r="70" fill="url(#wdSun)"/>
  <circle cx="640" cy="44" r="16" fill="#FFFBEA"/>
  <!-- far shore: pines stay green, cypress bare in winter -->
  <path d="M0,124 Q30,106 60,118 Q80,98 110,114 Q140,102 170,116 Q210,94 250,114 Q290,106 330,118 L330,132 L0,132Z" fill="#6E8A6E" opacity=".85"/>
  <path d="M560,126 Q600,110 640,122 Q690,102 740,120 Q790,108 840,122 Q880,112 920,120 L920,132 L560,132Z" fill="#6E8A6E" opacity=".85"/>
  <g stroke="#8A7A66" stroke-width="2" fill="none" opacity=".8">
    <path d="M420,128 V96 M420,104 l-10,-8 M420,110 l12,-9 M420,100 l8,-10"/>
    <path d="M470,128 V90 M470,98 l-12,-7 M470,106 l10,-8 M470,95 l7,-9"/>
    <path d="M520,128 V100 M520,108 l-9,-7 M520,112 l10,-6"/>
  </g>
  <path d="M330,126 Q400,118 460,124 Q510,116 560,126 L560,132 L330,132Z" fill="#8FA08B" opacity=".7"/>
  <!-- pond -->
  <rect x="0" y="132" width="920" height="68" fill="url(#wdWater)"/>
  <g class="wd-shim" stroke="#EEF5F4" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M200,176 h40"/><path d="M430,170 h34"/><path d="M560,186 h28"/><path d="M700,174 h36"/><path d="M850,188 h30"/>
  </g>
  <!-- the clear spring run, front left, with a resting manatee -->
  <path d="M0,150 Q60,140 130,150 Q170,158 160,200 L0,200Z" fill="url(#wdSpring)" opacity=".95"/>
  <g transform="translate(74,176)">
    <path d="M-50,-4 C-50,-14 -36,-17 -24,-15 C-4,-13 22,-12 38,-6 C46,-3 46,5 38,7 C20,12 -10,13 -30,10 C-44,8 -50,4 -50,-4Z" fill="#8E9B99"/>
    <path d="M36,-4 C48,-12 62,-12 64,0 C62,12 48,12 36,5Z" fill="#7E8B89"/>
    <path d="M-50,-4 C-56,-6 -60,-2 -58,3 C-56,7 -51,7 -48,4Z" fill="#9AA6A4"/>
    <path d="M-30,6 C-28,14 -20,18 -14,16 C-18,12 -20,8 -22,6Z" fill="#7E8B89"/>
    <path d="M-40,-10 C-20,-14 10,-12 34,-6" stroke="#A9B4B2" stroke-width="2" fill="none" opacity=".7"/>
    <circle cx="-48" cy="-8" r="1.3" fill="#4A5553"/>
    <circle class="wd-breath" cx="-55" cy="-16" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  </g>
  <!-- brown winter cattails, left of center -->
  <g stroke-linecap="round" fill="none">
    <path d="M232,200 C234,160 230,120 236,80" stroke="#A08A5A" stroke-width="3"/>
    <path d="M250,200 C254,160 258,110 254,64" stroke="#9A8452" stroke-width="3"/>
    <path d="M268,200 C266,170 274,130 286,104" stroke="#A9925E" stroke-width="2.5"/>
    <path d="M216,200 C212,172 200,140 192,116" stroke="#B19B66" stroke-width="2.5"/>
  </g>
  <rect x="248.5" y="72" width="11" height="36" rx="5.5" fill="#6B4528"/>
  <rect x="230.5" y="90" width="10" height="30" rx="5" fill="#5E3C22"/>
  <!-- ducks resting on open water -->
  <g fill="#3B3430">
    <g transform="translate(410,160)"><g class="wd-bob"><path d="M-16,0 Q-14,-9 2,-8 Q8,-15 14,-12 Q18,-9 16,-5 L22,-4 L15,-2 Q16,6 -10,5 Q-18,4 -16,0Z"/><path d="M-12,-1 Q0,-4 10,-1" stroke="#C9C2B4" stroke-width="2" fill="none"/></g></g>
    <g transform="translate(470,170) scale(.9)"><g class="wd-bob2"><path d="M-16,0 Q-14,-9 2,-8 Q8,-15 14,-12 Q18,-9 16,-5 L22,-4 L15,-2 Q16,6 -10,5 Q-18,4 -16,0Z"/><path d="M-12,-1 Q0,-4 10,-1" stroke="#C9C2B4" stroke-width="2" fill="none"/></g></g>
    <g transform="translate(530,158) scale(.8)"><g class="wd-bob"><path d="M-16,0 Q-14,-9 2,-8 Q8,-15 14,-12 Q18,-9 16,-5 L22,-4 L15,-2 Q16,6 -10,5 Q-18,4 -16,0Z"/><path d="M-12,-1 Q0,-4 10,-1" stroke="#C9C2B4" stroke-width="2" fill="none"/></g></g>
    <g transform="translate(600,176) scale(1.05)"><g class="wd-bob2"><path d="M-16,0 Q-14,-9 2,-8 Q8,-15 14,-12 Q18,-9 16,-5 L22,-4 L15,-2 Q16,6 -10,5 Q-18,4 -16,0Z"/><path d="M-12,-1 Q0,-4 10,-1" stroke="#C9C2B4" stroke-width="2" fill="none"/></g></g>
  </g>
  <!-- ducks arriving from the north, wings set to land -->
  <g class="wd-land" fill="#3B3430">
    <g transform="translate(720,58)"><path d="M-12,0 Q0,-3 12,0 Q4,3 -12,0Z"/><path d="M-2,-1 Q-10,-14 -22,-12 Q-12,-6 -4,0Z"/><path d="M2,-1 Q12,-12 24,-14 Q14,-5 4,0Z"/><circle cx="-13" cy="-1" r="3"/></g>
    <g transform="translate(770,40) scale(.8)"><path d="M-12,0 Q0,-3 12,0 Q4,3 -12,0Z"/><path d="M-2,-1 Q-10,-14 -22,-12 Q-12,-6 -4,0Z"/><path d="M2,-1 Q12,-12 24,-14 Q14,-5 4,0Z"/><circle cx="-13" cy="-1" r="3"/></g>
    <g transform="translate(812,66) scale(.7)"><path d="M-12,0 Q0,-3 12,0 Q4,3 -12,0Z"/><path d="M-2,-1 Q-10,-14 -22,-12 Q-12,-6 -4,0Z"/><path d="M2,-1 Q12,-12 24,-14 Q14,-5 4,0Z"/><circle cx="-13" cy="-1" r="3"/></g>
  </g>
  <!-- holly on the bank with a robin -->
  <g>
    <path d="M820,200 C818,170 812,150 800,128 M818,166 C836,156 852,150 872,148" stroke="#5B4632" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#2F6B46">
      <path d="M790,130 l10,-8 l6,10 l-10,6Z"/><path d="M806,140 l12,-6 l2,12 l-12,2Z"/><path d="M846,150 l10,-9 l6,10 l-10,6Z"/><path d="M864,146 l12,-4 l0,12 l-11,0Z"/><path d="M780,146 l10,-6 l4,11 l-11,3Z"/>
    </g>
    <g fill="#C8283A"><circle cx="812" cy="134" r="3"/><circle cx="818" cy="138" r="3"/><circle cx="858" cy="146" r="3"/><circle cx="852" cy="141" r="2.6"/><circle cx="792" cy="142" r="2.6"/></g>
    <g transform="translate(840,136)">
      <ellipse cx="0" cy="0" rx="13" ry="9" fill="#5A5048"/>
      <ellipse cx="2" cy="3" rx="10" ry="6.5" fill="#C9612E"/>
      <circle cx="-11" cy="-7" r="6.5" fill="#33302E"/>
      <path d="M-17,-7 l-6,1.5 l6,1.5Z" fill="#E3B23C"/>
      <circle cx="-12" cy="-8.5" r="1.2" fill="#fff"/>
      <path d="M12,-2 L24,-6 L22,2Z" fill="#4A423C"/>
      <path d="M-2,8 v6 M3,8 v6" stroke="#6B5A3C" stroke-width="1.4"/>
    </g>
  </g>
</svg>
