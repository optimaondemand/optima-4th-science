<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Dusk at Palmetto Springs. A campfire burns by the water with a marshmallow browning on a stick, smoke curling up and fireflies over the spring.">
  <defs>
    <linearGradient id="b291sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2A55"/><stop offset=".55" stop-color="#7A4E7A"/><stop offset="1" stop-color="#E8956A"/></linearGradient>
    <linearGradient id="b291water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5D5A86"/><stop offset="1" stop-color="#26284A"/></linearGradient>
    <radialGradient id="b291glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB347" stop-opacity=".55"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
    <style>
      .b291-fl { animation: b291fl .5s ease-in-out infinite alternate; transform-origin: 470px 150px; }
      @keyframes b291fl { from { transform: scaleY(.92); } to { transform: scaleY(1.08); } }
      .b291-smoke { animation: b291sm 4s ease-out infinite; }
      @keyframes b291sm { 0% { transform: translateY(0); opacity: .55; } 100% { transform: translateY(-50px); opacity: 0; } }
      .b291-ff { animation: b291ff 2.6s ease-in-out infinite; } .b291-ff2 { animation-delay: 1.1s; } .b291-ff3 { animation-delay: .5s; }
      @keyframes b291ff { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .b291-fl, .b291-smoke, .b291-ff { animation: none; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b291sky)"/>
  <circle cx="160" cy="44" r="16" fill="#F6E7C1" opacity=".9"/>
  <path d="M0 112 Q120 96 240 106 T480 100 T720 108 T920 100 V126 H0z" fill="#2E3B2C"/>
  <g fill="#22301F"><path d="M60 112 l6 -40 l3 40z"/><path d="M66 106 q-16 -24 -30 -26 q16 10 26 28z"/><path d="M68 106 q14 -26 30 -28 q-16 10 -26 30z"/>
    <path d="M840 110 l5 -46 l3 46z"/><path d="M846 104 q-18 -26 -34 -28 q18 10 28 30z"/><path d="M848 104 q16 -28 34 -30 q-18 12 -28 32z"/></g>
  <rect y="122" width="920" height="78" fill="url(#b291water)"/>
  <path d="M560 140 h220" stroke="#FFB347" stroke-width="3" opacity=".35"/><path d="M590 152 h150" stroke="#FFB347" stroke-width="2" opacity=".25"/>
  <!-- the bank and the fire -->
  <path d="M330 200 Q330 150 470 146 Q610 150 610 200z" fill="#4A3B2A"/>
  <circle cx="470" cy="150" r="80" fill="url(#b291glow)"/>
  <g fill="#6E6A66"><ellipse cx="420" cy="166" rx="16" ry="9"/><ellipse cx="452" cy="172" rx="16" ry="9"/><ellipse cx="490" cy="172" rx="16" ry="9"/><ellipse cx="520" cy="166" rx="16" ry="9"/></g>
  <path d="M432 164 l76 -18 M436 150 l70 18" stroke="#5C3A1E" stroke-width="8" stroke-linecap="round"/>
  <g class="b291-fl"><path d="M470 160 q-26 -22 -6 -52 q4 18 14 20 q-2 -18 12 -30 q2 26 16 36 q6 16 -8 26z" fill="#F28C28"/><path d="M472 160 q-12 -14 -2 -32 q6 12 12 14 q4 12 -4 18z" fill="#FFD34D"/></g>
  <g class="b291-smoke"><path d="M478 104 q-10 -14 2 -26 q12 -12 0 -26" fill="none" stroke="#C9C2C8" stroke-width="6" stroke-linecap="round" opacity=".5"/></g>
  <!-- the stick with a browning marshmallow -->
  <path d="M640 182 L520 118" stroke="#7A5530" stroke-width="5" stroke-linecap="round"/>
  <rect x="502" y="104" width="24" height="20" rx="7" fill="#F4E3C3" stroke="#B37A3A" stroke-width="2" transform="rotate(28 514 114)"/>
  <path d="M504 116 q8 -10 20 -4" stroke="#9C5A22" stroke-width="5" fill="none" opacity=".85"/>
  <!-- fireflies -->
  <circle class="b291-ff" cx="640" cy="96" r="2.5" fill="#F6F59A"/><circle class="b291-ff b291-ff2" cx="700" cy="118" r="2.5" fill="#F6F59A"/><circle class="b291-ff b291-ff3" cx="760" cy="90" r="2.5" fill="#F6F59A"/>
  <circle class="b291-ff b291-ff2" cx="250" cy="104" r="2.5" fill="#F6F59A"/><circle class="b291-ff" cx="300" cy="86" r="2.5" fill="#F6F59A"/>
</svg>
