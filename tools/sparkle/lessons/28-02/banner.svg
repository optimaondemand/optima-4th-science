<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="The Palmetto Springs dock at golden hour. On a plank, a magnet sits at the end of a ruler and a paperclip leaps toward it. A steel can and an aluminum can stand beside two bins.">
  <defs>
    <linearGradient id="b282sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6C98A"/><stop offset=".6" stop-color="#F9DDB0"/><stop offset="1" stop-color="#FBE9CC"/></linearGradient>
    <linearGradient id="b282water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA7B5"/><stop offset="1" stop-color="#2F5F6E"/></linearGradient>
    <style>
      .b282-clip { animation: b282jump 3s ease-in infinite; }
      @keyframes b282jump { 0%,55% { transform: translateX(0); } 70%,92% { transform: translateX(-58px); } 100% { transform: translateX(0); } }
      .b282-glint { animation: b282gl 5s ease-in-out infinite; }
      @keyframes b282gl { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .b282-clip, .b282-glint { animation: none; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b282sky)"/>
  <circle cx="140" cy="58" r="30" fill="#FFE2A3" opacity=".9"/>
  <path d="M0 98 Q90 86 180 94 T360 90 T560 96 T760 88 T920 94 V112 H0z" fill="#5E7B4C"/>
  <rect y="108" width="920" height="92" fill="url(#b282water)"/>
  <rect class="b282-glint" x="60" y="122" width="180" height="4" rx="2" fill="#FFE7B0"/>
  <rect class="b282-glint" x="680" y="134" width="140" height="3" rx="1.5" fill="#FFE7B0"/>
  <g fill="#4F6E3E"><rect x="842" y="80" width="3" height="40"/><rect x="852" y="74" width="3" height="46"/><rect x="862" y="84" width="3" height="36"/></g>
  <!-- the dock plank -->
  <rect x="220" y="138" width="520" height="16" fill="#8A6A44"/><rect x="220" y="134" width="520" height="6" fill="#A98656"/>
  <g fill="#6E5236"><rect x="236" y="154" width="10" height="46"/><rect x="474" y="154" width="10" height="46"/><rect x="714" y="154" width="10" height="46"/></g>
  <!-- the ruler -->
  <rect x="300" y="120" width="250" height="16" fill="#F3D98B" stroke="#B08A1E" stroke-width="1.5"/>
  <g stroke="#5C442E" stroke-width="1.5">
    <line x1="310" y1="120" x2="310" y2="129"/><line x1="333" y1="120" x2="333" y2="126"/><line x1="356" y1="120" x2="356" y2="126"/><line x1="379" y1="120" x2="379" y2="126"/><line x1="402" y1="120" x2="402" y2="126"/>
    <line x1="425" y1="120" x2="425" y2="129"/><line x1="448" y1="120" x2="448" y2="126"/><line x1="471" y1="120" x2="471" y2="126"/><line x1="494" y1="120" x2="494" y2="126"/><line x1="517" y1="120" x2="517" y2="126"/><line x1="540" y1="120" x2="540" y2="129"/>
  </g>
  <!-- the magnet at the end of the ruler -->
  <rect x="262" y="104" width="22" height="30" fill="#2D6FB8" stroke="#3B3328" stroke-width="1.5"/><rect x="284" y="104" width="22" height="30" fill="#D9453B" stroke="#3B3328" stroke-width="1.5"/>
  <!-- the paperclip, leaping toward the magnet -->
  <g transform="translate(372 108)"><g class="b282-clip">
    <path d="M2 4 h26 a4 4 0 0 1 0 8 h-22 a3 3 0 0 1 0 -6 h18" fill="none" stroke="#7E868B" stroke-width="2.5" stroke-linecap="round"/>
  </g></g>
  <!-- two bins with a steel can and an aluminum can -->
  <g transform="translate(590 92)">
    <path d="M0 6 h46 l-5 46 h-36z" fill="#5B646B" stroke="#3B3328" stroke-width="1.5"/>
    <rect x="12" y="-10" width="20" height="24" rx="2" fill="#B9BFC4" stroke="#6C757B" stroke-width="1.5"/><line x1="12" y1="-2" x2="32" y2="-2" stroke="#8C959B"/><line x1="12" y1="6" x2="32" y2="6" stroke="#8C959B"/>
    <path d="M60 6 h46 l-5 46 h-36z" fill="#2F7A55" stroke="#1F4F38" stroke-width="1.5"/>
    <rect x="74" y="-12" width="18" height="26" rx="4" fill="#DCE3E7" stroke="#9AA5AC" stroke-width="1.5"/><ellipse cx="83" cy="-12" rx="9" ry="2.5" fill="#C9D1D6"/>
  </g>
</svg>
