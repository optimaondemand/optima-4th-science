<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="A brass two-pan balance beside a Florida spring in the morning. One pan holds a small brass trophy taken apart into its pieces: the cup, two handles, the stem and the base. The other pan holds a whole matching trophy. The pans sit perfectly level.">
  <defs>
    <linearGradient id="bn272sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE3F2"/><stop offset="0.6" stop-color="#E8F3E6"/><stop offset="1" stop-color="#F6EBCF"/>
    </linearGradient>
    <linearGradient id="bn272water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FCAD6"/><stop offset="1" stop-color="#2F8796"/>
    </linearGradient>
    <linearGradient id="bn272brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5F1E"/><stop offset="0.5" stop-color="#EDD08A"/><stop offset="1" stop-color="#8A5F1E"/>
    </linearGradient>
    <linearGradient id="bn272cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B07F2E"/><stop offset="0.45" stop-color="#F4DC96"/><stop offset="1" stop-color="#A97A2B"/>
    </linearGradient>
    <style>
      .bn272-rip { animation: bn272rip 6s ease-out infinite; transform-origin: 0 0; }
      .bn272-rip2 { animation: bn272rip 6s ease-out 3s infinite; transform-origin: 0 0; }
      @keyframes bn272rip { 0% { transform: scale(0.3); opacity: 0.85; } 100% { transform: scale(1.1); opacity: 0; } }
      .bn272-glint { animation: bn272glint 4s ease-in-out infinite; }
      .bn272-glint2 { animation: bn272glint 4s ease-in-out 2s infinite; }
      @keyframes bn272glint { 0%, 70%, 100% { opacity: 0; } 82% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .bn272-rip, .bn272-rip2, .bn272-glint, .bn272-glint2 { animation: none; } .bn272-rip2, .bn272-glint, .bn272-glint2 { opacity: 0; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#bn272sky)"/>
  <!-- far bank: cypress and palmettos -->
  <path d="M0 112 Q120 96 240 106 T480 104 T720 100 T920 108 V130 H0 z" fill="#5E8A4E"/>
  <g fill="#3F6B3A">
    <path d="M70 108 l10 -52 l10 52 z"/><path d="M96 110 l7 -36 l7 36 z"/>
    <path d="M800 104 l11 -58 l11 58 z"/><path d="M830 106 l8 -40 l8 40 z"/>
  </g>
  <g fill="#4C7A3E" opacity="0.9">
    <path d="M610 104 q-14 -20 -30 -22 q16 6 24 22 z"/><path d="M612 104 q4 -24 18 -32 q-10 12 -12 32 z"/><path d="M614 104 q16 -16 34 -14 q-18 4 -28 16 z"/>
  </g>
  <!-- spring water -->
  <rect y="124" width="920" height="76" fill="url(#bn272water)"/>
  <g transform="translate(170 158)"><ellipse class="bn272-rip" rx="70" ry="10" fill="none" stroke="#DFF4F7" stroke-width="2"/></g>
  <g transform="translate(170 158)"><ellipse class="bn272-rip2" rx="70" ry="10" fill="none" stroke="#DFF4F7" stroke-width="2"/></g>
  <!-- near bank where the balance stands -->
  <path d="M300 200 Q330 150 460 146 Q600 144 650 200 z" fill="#C9B07A"/>
  <path d="M320 200 Q350 162 460 160 Q580 160 630 200 z" fill="#B59A62"/>
  <!-- the balance: post, level beam, two pans -->
  <rect x="452" y="64" width="16" height="96" rx="4" fill="url(#bn272brass)" stroke="#6E4B17" stroke-width="2"/>
  <path d="M430 166 h60 l-8 -10 h-44 z" fill="#8A5F1E" stroke="#6E4B17" stroke-width="2"/>
  <circle cx="460" cy="62" r="9" fill="#E8C878" stroke="#6E4B17" stroke-width="2"/>
  <rect x="340" y="58" width="240" height="8" rx="4" fill="url(#bn272brass)" stroke="#6E4B17" stroke-width="2"/>
  <path d="M460 50 l-4 -12 h8 z" fill="#6E4B17"/>
  <!-- left hangers + pan -->
  <path d="M352 64 L326 120 M352 64 L378 120" stroke="#6E4B17" stroke-width="2"/>
  <path d="M306 120 h92 q-6 14 -46 14 q-40 0 -46 -14 z" fill="url(#bn272brass)" stroke="#6E4B17" stroke-width="2"/>
  <!-- right hangers + pan -->
  <path d="M568 64 L542 120 M568 64 L594 120" stroke="#6E4B17" stroke-width="2"/>
  <path d="M522 120 h92 q-6 14 -46 14 q-40 0 -46 -14 z" fill="url(#bn272brass)" stroke="#6E4B17" stroke-width="2"/>
  <!-- left pan: the trophy in pieces -->
  <path d="M318 98 h22 l-3 16 q-2 6 -8 6 q-6 0 -8 -6 z" fill="url(#bn272cup)" stroke="#8A5F1E" stroke-width="1.5"/>
  <path d="M346 116 q-8 -2 -7 -10 q1 -7 9 -7" fill="none" stroke="#B07F2E" stroke-width="3.5"/>
  <path d="M356 116 q8 -2 7 -10 q-1 -7 -9 -7" fill="none" stroke="#B07F2E" stroke-width="3.5"/>
  <rect x="368" y="108" width="7" height="11" fill="#C99B3F" stroke="#8A5F1E" stroke-width="1.5"/>
  <path d="M380 119 h18 l3 -7 h-24 z" fill="#4A3524" stroke="#32241A" stroke-width="1.5"/>
  <!-- right pan: the whole trophy -->
  <g transform="translate(546 78)">
    <path d="M6 4 h32 l-3 22 q-2 11 -13 11 q-11 0 -13 -11 z" fill="url(#bn272cup)" stroke="#8A5F1E" stroke-width="1.5"/>
    <path d="M6 7 q-9 1 -8 9 q1 7 10 8" fill="none" stroke="#B07F2E" stroke-width="3.5"/>
    <path d="M38 7 q9 1 8 9 q-1 7 -10 8" fill="none" stroke="#B07F2E" stroke-width="3.5"/>
    <rect x="18" y="37" width="8" height="5" fill="#C99B3F" stroke="#8A5F1E" stroke-width="1.5"/>
    <path d="M8 42 h28 l3 7 h-34 z" fill="#4A3524" stroke="#32241A" stroke-width="1.5"/>
    <ellipse cx="16" cy="14" rx="2.5" ry="7" fill="#FFF4D0" opacity="0.6"/>
  </g>
  <!-- glints on the brass -->
  <path class="bn272-glint" d="M330 100 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#FFFBEA"/>
  <path class="bn272-glint2" d="M566 86 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#FFFBEA"/>
  <!-- cattails on the right bank -->
  <g stroke="#4C7A3E" stroke-width="3" fill="none"><path d="M760 200 q4 -40 2 -70"/><path d="M776 200 q-2 -36 4 -60"/><path d="M790 200 q6 -30 2 -52"/></g>
  <g fill="#7A4E2A"><rect x="758" y="124" width="7" height="22" rx="3"/><rect x="777" y="134" width="7" height="20" rx="3"/><rect x="789" y="142" width="7" height="18" rx="3"/></g>
</svg>
