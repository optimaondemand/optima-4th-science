<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Night on the Palmetto Beach boardwalk under string lights: a white golf cart has just bumped a pink ice cream cart with a yellow umbrella. Sound lines burst from where they touch, a warm orange glow marks the dent, and a scoop of mint ice cream tumbles through the air. The moon shines over the Gulf behind the pier railing.">
  <style>
    .b211tw { animation: b211tw 3s ease-in-out infinite; } .b211tw.t2 { animation-delay: 1s; } .b211tw.t3 { animation-delay: 2s; }
    .b211bulb { animation: b211bulb 2.4s ease-in-out infinite; } .b211bulb.u2 { animation-delay: .8s; } .b211bulb.u3 { animation-delay: 1.6s; }
    .b211snd { animation: b211snd 1.6s ease-out infinite; transform-box: fill-box; transform-origin: left center; } .b211snd.n2 { animation-delay: .25s; } .b211snd.n3 { animation-delay: .5s; }
    .b211heat { animation: b211heat 2s ease-in-out infinite; }
    .b211scoop { animation: b211scoop 3.2s ease-in-out infinite; }
    .b211wave { animation: b211wave 6s ease-in-out infinite; }
    @keyframes b211tw { 50% { opacity: .25; } }
    @keyframes b211bulb { 50% { opacity: .55; } }
    @keyframes b211snd { 0% { opacity: 0; transform: scaleX(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1.25); } }
    @keyframes b211heat { 50% { opacity: .45; } }
    @keyframes b211scoop { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(6px, -8px) rotate(25deg); } }
    @keyframes b211wave { 50% { transform: translateX(-12px); } }
    @media (prefers-reduced-motion: reduce) { .b211tw, .b211bulb, .b211snd, .b211heat, .b211scoop, .b211wave { animation: none; } }
  </style>
  <defs>
    <linearGradient id="b211sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101A3A"/><stop offset="1" stop-color="#2C3E6E"/></linearGradient>
    <linearGradient id="b211sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F3561"/><stop offset="1" stop-color="#16264A"/></linearGradient>
    <linearGradient id="b211deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9825A"/><stop offset="1" stop-color="#7A5A3A"/></linearGradient>
    <radialGradient id="b211glow"><stop offset="0" stop-color="#FFD15A" stop-opacity=".95"/><stop offset=".5" stop-color="#FF8A2E" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/></radialGradient>
    <radialGradient id="b211moon"><stop offset="0" stop-color="#FFFBE6"/><stop offset=".7" stop-color="#F6EBB8"/><stop offset="1" stop-color="#F6EBB8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="920" height="200" fill="url(#b211sky)"/>
  <circle class="b211tw" cx="70" cy="24" r="1.6" fill="#fff"/><circle class="b211tw t2" cx="210" cy="40" r="1.3" fill="#fff"/><circle class="b211tw t3" cx="330" cy="18" r="1.5" fill="#fff"/>
  <circle class="b211tw t2" cx="560" cy="30" r="1.4" fill="#fff"/><circle class="b211tw" cx="640" cy="14" r="1.2" fill="#fff"/><circle class="b211tw t3" cx="860" cy="36" r="1.6" fill="#fff"/>
  <circle cx="780" cy="44" r="30" fill="url(#b211moon)"/><circle cx="780" cy="44" r="17" fill="#FFF8DC"/>
  <rect y="84" width="920" height="44" fill="url(#b211sea)"/>
  <g class="b211wave"><path d="M0 100 q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#3E5A92" stroke-width="2"/>
    <path d="M760 96 l40 0 M748 106 l60 0 M770 116 l30 0" stroke="#F6EBB8" stroke-width="2" opacity=".5"/></g>
  <!-- the railing -->
  <rect y="118" width="920" height="6" fill="#5B4126"/>
  <g fill="#5B4126">
    <rect x="20" y="104" width="6" height="30"/><rect x="120" y="104" width="6" height="30"/><rect x="220" y="104" width="6" height="30"/><rect x="320" y="104" width="6" height="30"/><rect x="420" y="104" width="6" height="30"/>
    <rect x="520" y="104" width="6" height="30"/><rect x="620" y="104" width="6" height="30"/><rect x="720" y="104" width="6" height="30"/><rect x="820" y="104" width="6" height="30"/>
  </g>
  <rect y="104" width="920" height="4" fill="#6E5131"/>
  <!-- string lights -->
  <path d="M0 52 Q115 76 230 52 Q345 76 460 52 Q575 76 690 52 Q805 76 920 52" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
  <g fill="#FFE08A">
    <circle class="b211bulb" cx="58" cy="62" r="4"/><circle class="b211bulb u2" cx="115" cy="65" r="4"/><circle class="b211bulb u3" cx="172" cy="62" r="4"/>
    <circle class="b211bulb u2" cx="288" cy="62" r="4"/><circle class="b211bulb" cx="345" cy="65" r="4"/><circle class="b211bulb u3" cx="402" cy="62" r="4"/>
    <circle class="b211bulb u3" cx="518" cy="62" r="4"/><circle class="b211bulb u2" cx="575" cy="65" r="4"/><circle class="b211bulb" cx="632" cy="62" r="4"/>
    <circle class="b211bulb" cx="748" cy="62" r="4"/><circle class="b211bulb u3" cx="805" cy="65" r="4"/><circle class="b211bulb u2" cx="862" cy="62" r="4"/>
  </g>
  <!-- the boardwalk -->
  <rect y="134" width="920" height="66" fill="url(#b211deck)"/>
  <g stroke="#6A4C2E" stroke-width="2" opacity=".6"><line x1="0" y1="150" x2="920" y2="150"/><line x1="0" y1="168" x2="920" y2="168"/><line x1="0" y1="186" x2="920" y2="186"/></g>
  <!-- golf cart (left), facing right -->
  <g transform="translate(270 0)">
    <rect x="-8" y="78" width="146" height="9" rx="4" fill="#2E8C82"/>
    <rect x="4" y="86" width="5" height="44" fill="#4A5868"/><rect x="118" y="86" width="5" height="44" fill="#4A5868"/>
    <path d="M-6 158 L-6 128 Q-6 118 6 118 L112 118 Q132 118 140 132 L146 158 Z" fill="#F4F4F0" stroke="#4A5868" stroke-width="2.5"/>
    <rect x="16" y="104" width="44" height="16" rx="5" fill="#D9DEE3" stroke="#4A5868" stroke-width="2"/>
    <rect x="138" y="140" width="10" height="18" rx="3" fill="#2B2B2B"/>
    <circle cx="20" cy="160" r="15" fill="#2B2B2B"/><circle cx="20" cy="160" r="6" fill="#9AA5B1"/>
    <circle cx="118" cy="160" r="15" fill="#2B2B2B"/><circle cx="118" cy="160" r="6" fill="#9AA5B1"/>
    <circle cx="140" cy="128" r="5" fill="#FFF3B0"/>
  </g>
  <!-- the heat glow and the bump -->
  <circle class="b211heat" cx="420" cy="148" r="26" fill="url(#b211glow)"/>
  <g stroke="#FFE79A" stroke-width="3" stroke-linecap="round" fill="none">
    <path class="b211snd" d="M424 116 q10 -10 22 -12"/><path class="b211snd n2" d="M428 126 q14 -6 28 -4"/><path class="b211snd n3" d="M424 106 q6 -16 16 -24"/>
  </g>
  <!-- ice cream cart (right), knocked a little forward -->
  <g transform="translate(428 0) rotate(-3 80 150)">
    <rect x="-8" y="140" width="12" height="18" rx="3" fill="#2B2B2B"/>
    <rect x="0" y="112" width="150" height="48" rx="8" fill="#F8C8DC" stroke="#B5577E" stroke-width="2.5"/>
    <path d="M2 118 l10 6 l-10 6" stroke="#C0607E" stroke-width="2" fill="none"/>
    <rect x="12" y="124" width="126" height="20" rx="4" fill="#FCE3EC"/>
    <circle cx="40" cy="134" r="7" fill="#9EE0C4"/><circle cx="62" cy="134" r="7" fill="#FFF2C8"/><circle cx="84" cy="134" r="7" fill="#C9A06A"/><circle cx="106" cy="134" r="7" fill="#F49AB8"/>
    <line x1="75" y1="112" x2="75" y2="56" stroke="#8A8A8A" stroke-width="3"/>
    <path d="M10 60 Q75 22 140 60 Z" fill="#FFE08A" stroke="#D9A400" stroke-width="2.5"/>
    <path d="M42 60 Q75 34 108 60" fill="none" stroke="#F2C94C" stroke-width="2"/>
    <circle cx="28" cy="162" r="13" fill="#2B2B2B"/><circle cx="28" cy="162" r="5" fill="#9AA5B1"/>
    <circle cx="124" cy="162" r="13" fill="#2B2B2B"/><circle cx="124" cy="162" r="5" fill="#9AA5B1"/>
  </g>
  <!-- the tumbling scoop -->
  <g transform="translate(520 92)"><g class="b211scoop"><circle r="10" fill="#9EE0C4" stroke="#6CBF9E" stroke-width="2"/><circle cx="-3" cy="-3" r="1.6" fill="#3E2A1A"/><circle cx="4" cy="1" r="1.6" fill="#3E2A1A"/><circle cx="-1" cy="4" r="1.4" fill="#3E2A1A"/></g></g>
  <!-- motion lines behind the golf cart -->
  <g stroke="#E8D9BE" stroke-width="3" stroke-linecap="round" opacity=".55"><line x1="190" y1="128" x2="240" y2="128"/><line x1="200" y1="142" x2="244" y2="142"/><line x1="214" y1="114" x2="246" y2="114"/></g>
</svg>
