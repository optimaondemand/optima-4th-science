<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same night marsh: a bat swoops at a moth near a porch light, sending out clicks that bounce back as echoes, while a bald eagle sleeps on a dead tree.">
  <defs>
    <linearGradient id="fsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081629"/><stop offset=".55" stop-color="#14374E"/><stop offset="1" stop-color="#2B5A57"/>
    </linearGradient>
    <linearGradient id="fsWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153A44"/><stop offset="1" stop-color="#081A20"/>
    </linearGradient>
    <radialGradient id="fsMoonGlow"><stop offset="0" stop-color="#FFF4C8" stop-opacity=".55"/><stop offset="1" stop-color="#FFF4C8" stop-opacity="0"/></radialGradient>
    <radialGradient id="fsBrain"><stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#F5B83D" stop-opacity=".7"/><stop offset="1" stop-color="#F5B83D" stop-opacity="0"/></radialGradient>
    <radialGradient id="fsLamp"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset=".35" stop-color="#F5B83D" stop-opacity=".35"/><stop offset="1" stop-color="#F5B83D" stop-opacity="0"/></radialGradient>
    <radialGradient id="fsFly"><stop offset="0" stop-color="#F7FFB0"/><stop offset="1" stop-color="#F7FFB0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="920" height="200" fill="url(#fsSky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="24" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="40" r="1"><animate attributeName="opacity" values="1;.3;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="18" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="52" r="1"/><circle cx="620" cy="22" r="1.1"/>
    <circle cx="860" cy="30" r="1.3"><animate attributeName="opacity" values=".5;1;.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60" r=".9"/><circle cx="340" cy="70" r=".8"/>
  </g>
  <!-- moon -->
  <circle cx="140" cy="48" r="60" fill="url(#fsMoonGlow)"/>
  <circle cx="140" cy="48" r="20" fill="#FFF6D6"/>
  <circle cx="133" cy="44" r="4" fill="#EDE2B8" opacity=".6"/><circle cx="148" cy="55" r="3" fill="#EDE2B8" opacity=".5"/>
  <!-- far treeline -->
  <path d="M0,128 Q30,112 60,122 Q90,104 120,120 Q160,100 200,118 Q240,108 270,121 Q320,98 360,118 Q400,110 440,122 Q480,102 520,119 Q560,108 600,121 Q650,100 700,118 Q740,110 780,122 Q830,104 870,119 Q900,112 920,120 L920,145 L0,145 Z" fill="#0E2620"/>
  <!-- cypress trees -->
  <g fill="#0A1C17">
    <path d="M40,145 L46,60 Q47,52 50,60 L56,145 Z"/><path d="M28,72 Q48,58 70,72 Q50,66 28,72 Z"/><path d="M24,92 Q50,76 76,92 Q50,86 24,92 Z"/>
    <path d="M500,145 L505,74 Q507,66 509,74 L514,145 Z"/><path d="M488,86 Q507,74 528,88 Q507,82 488,86 Z"/>
    <path d="M884,145 L890,54 Q892,46 894,54 L900,145 Z"/><path d="M870,70 Q892,54 914,70 Q892,64 870,70 Z"/><path d="M866,96 Q892,80 918,96 Q892,90 866,96 Z"/>
  </g>
  <!-- spanish moss -->
  <g stroke="#3D5A48" stroke-width="1.4" fill="none" opacity=".8">
    <path d="M34,74 q2,12 -1,22"/><path d="M44,76 q-2,14 1,26"/><path d="M62,74 q3,10 0,18"/>
    <path d="M876,72 q2,12 -1,22"/><path d="M906,72 q-2,14 1,24"/>
  </g>
  <!-- water -->
  <rect y="145" width="920" height="55" fill="url(#fsWater)"/>
  <g stroke="#FFF4C8" stroke-linecap="round" opacity=".35">
    <line x1="120" y1="156" x2="160" y2="156" stroke-width="2"/><line x1="128" y1="164" x2="152" y2="164" stroke-width="1.5"/><line x1="134" y1="172" x2="146" y2="172" stroke-width="1"/>
  </g>
  <!-- bat house on poles across the pond -->
  <g fill="#0A1C17"><rect x="404" y="96" width="22" height="26" rx="1"/><path d="M400,97 L415,88 L430,97 Z"/><rect x="408" y="122" width="3" height="24"/><rect x="419" y="122" width="3" height="24"/></g>
  <!-- dead snag with a sleeping bald eagle -->
  <g>
    <path d="M232,145 L238,74 L242,74 L248,145 Z" fill="#132A24"/>
    <path d="M240,92 Q262,84 290,86" stroke="#132A24" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M239,108 Q222,100 206,104" stroke="#132A24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- eagle: dark body, white tail, white head tucked low (asleep) -->
    <path d="M262,86 Q256,60 270,50 Q286,46 290,62 Q292,78 282,88 Z" fill="#2A1E14"/>
    <path d="M262,86 Q268,62 276,52" stroke="#4B3A28" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M268,86 L264,100 L276,100 L280,86 Z" fill="#F4F1E6"/>
    <ellipse cx="284" cy="52" rx="11" ry="9" fill="#F4F1E6"/>
    <path d="M293,53 q6,1 5,6 q-3,-2 -6,-2 z" fill="#F2B02C"/>
    <path d="M281,50 q3,2 6,0" stroke="#3B2F1E" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M270,88 l-2,4 M276,88 l1,4" stroke="#F2B02C" stroke-width="2" stroke-linecap="round"/>
    <path d="M262,72 Q256,62 266,52" stroke="#FFF4C8" stroke-width="1" fill="none" opacity=".35"/>
  </g>
  <!-- porch light on a post by the water -->
  <g>
    <circle cx="790" cy="92" r="70" fill="url(#fsLamp)"><animate attributeName="opacity" values=".85;1;.85" dur="3s" repeatCount="indefinite"/></circle>
    <rect x="786" y="96" width="8" height="58" fill="#0A1C17"/>
    <rect x="770" y="150" width="60" height="6" fill="#0A1C17"/>
    <path d="M778,96 L802,96 L798,84 L782,84 Z" fill="#0A1C17"/>
    <circle cx="790" cy="90" r="6" fill="#FFF4C8"/>
    <!-- moths around the light -->
    <g fill="#E9DCC0">
      <g><path d="M0,0 l-6,-4 l1,7 z M0,0 l6,-4 l-1,7 z"/><animateTransform attributeName="transform" type="translate" values="820,70;828,64;818,74;820,70" dur="2.2s" repeatCount="indefinite"/></g>
      <g><path d="M0,0 l-5,-3 l1,6 z M0,0 l5,-3 l-1,6 z"/><animateTransform attributeName="transform" type="translate" values="764,76;758,70;768,66;764,76" dur="2.8s" repeatCount="indefinite"/></g>
      <g><path d="M0,0 l-5,-3 l1,6 z M0,0 l5,-3 l-1,6 z"/><animateTransform attributeName="transform" type="translate" values="806,112;814,118;800,116;806,112" dur="2.5s" repeatCount="indefinite"/></g>
    </g>
  </g>
  <!-- the hunted moth, and the echo coming back from it -->
  <g fill="#E9DCC0"><path d="M690,98 l-7,-5 l1,8 z M690,98 l7,-5 l-1,8 z"/></g>
  <g fill="none" stroke-linecap="round">
    <g stroke="#F5B83D" stroke-width="2.4">
      <path d="M612,80 q6,6 0,12"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M626,76 q9,10 0,20"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin=".2s" repeatCount="indefinite"/></path>
      <path d="M642,72 q12,14 0,28"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin=".4s" repeatCount="indefinite"/></path>
    </g>
    <g stroke="#7CE0A0" stroke-width="2">
      <path d="M676,90 q-8,8 0,16"><animate attributeName="opacity" values="0;0;1;0" dur="1.6s" begin=".6s" repeatCount="indefinite"/></path>
      <path d="M662,86 q-10,12 0,24"><animate attributeName="opacity" values="0;0;1;0" dur="1.6s" begin=".8s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <!-- the bat, wings up, swooping toward the moth -->
  <g transform="translate(588,82)">
    <animateTransform attributeName="transform" type="translate" values="586,80;592,84;586,80" dur="1.2s" repeatCount="indefinite"/>
    <g fill="#1C1420" stroke="#FFF4C8" stroke-opacity=".45" stroke-width=".8">
      <path d="M-4,0 Q-20,-20 -44,-16 Q-38,-10 -40,-4 Q-32,-8 -28,-2 Q-22,-6 -16,2 Q-10,-2 -4,4 Z">
        <animate attributeName="d" dur=".5s" repeatCount="indefinite" values="M-4,0 Q-20,-20 -44,-16 Q-38,-10 -40,-4 Q-32,-8 -28,-2 Q-22,-6 -16,2 Q-10,-2 -4,4 Z;M-4,0 Q-22,4 -44,10 Q-36,12 -36,18 Q-28,12 -24,18 Q-18,10 -12,14 Q-8,8 -4,4 Z;M-4,0 Q-20,-20 -44,-16 Q-38,-10 -40,-4 Q-32,-8 -28,-2 Q-22,-6 -16,2 Q-10,-2 -4,4 Z"/></path>
      <path d="M4,0 Q20,-20 44,-16 Q38,-10 40,-4 Q32,-8 28,-2 Q22,-6 16,2 Q10,-2 4,4 Z">
        <animate attributeName="d" dur=".5s" repeatCount="indefinite" values="M4,0 Q20,-20 44,-16 Q38,-10 40,-4 Q32,-8 28,-2 Q22,-6 16,2 Q10,-2 4,4 Z;M4,0 Q22,4 44,10 Q36,12 36,18 Q28,12 24,18 Q18,10 12,14 Q8,8 4,4 Z;M4,0 Q20,-20 44,-16 Q38,-10 40,-4 Q32,-8 28,-2 Q22,-6 16,2 Q10,-2 4,4 Z"/></path>
      <ellipse cx="0" cy="3" rx="7" ry="10"/>
      <circle cx="10" cy="-6" r="7"/>
      <path d="M6,-11 l-1,-11 l7,7 z M12,-12 l4,-10 l3,9 z"/>
    </g>
    <circle cx="14" cy="-7" r="1.3" fill="#FFF4C8"/>
  </g>
  <!-- reeds -->
  <g stroke="#0A1C17" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M14,200 q2,-40 -6,-70"/><path d="M24,200 q0,-48 8,-80"/><path d="M34,200 q-2,-34 -10,-58"/>
    <path d="M520,200 q2,-30 -4,-50"/><path d="M530,200 q0,-36 6,-60"/>
  </g>
</svg>
