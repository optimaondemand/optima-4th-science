<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Night at the Palmetto Beach boat parade: a bike on a stand spins a small generator, and a glowing wire carries its energy up to the string lights over Rosa’s cocoa cart. Lit boats sail on the bay, and a pelican sits on a post.">
  <defs>
    <linearGradient id="b242sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1433"/><stop offset=".7" stop-color="#1B2A5C"/><stop offset="1" stop-color="#2C3E78"/></linearGradient>
    <linearGradient id="b242sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14254F"/><stop offset="1" stop-color="#0A1430"/></linearGradient>
    <linearGradient id="b242steel" x1="0" x2="1"><stop offset="0" stop-color="#8E99A4"/><stop offset=".5" stop-color="#E6ECF1"/><stop offset="1" stop-color="#7F8A95"/></linearGradient>
    <linearGradient id="b242heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF6A2B"/><stop offset=".55" stop-color="#FFB547" stop-opacity=".85"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
    <radialGradient id="b242glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <linearGradient id="b242mug" x1="0" x2="1"><stop offset="0" stop-color="#C64A3A"/><stop offset=".45" stop-color="#E26A55"/><stop offset="1" stop-color="#A83A2D"/></linearGradient>
    <linearGradient id="b242wood" x1="0" x2="1"><stop offset="0" stop-color="#9A6635"/><stop offset=".5" stop-color="#C08A52"/><stop offset="1" stop-color="#8A5A2C"/></linearGradient>
  </defs>
  <style>
    .b242-tw { animation: b242tw 2.4s ease-in-out infinite; }
    .b242-tw:nth-child(3n) { animation-delay: .8s; } .b242-tw:nth-child(3n+1) { animation-delay: 1.6s; }
    @keyframes b242tw { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .b242-steam { animation: b242st 3.6s ease-in-out infinite; }
    .b242-steam.s2 { animation-delay: 1.8s; }
    @keyframes b242st { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-14px); } }
    .b242-bob { animation: b242bob 4s ease-in-out infinite; }
    .b242-bob.b2 { animation-delay: 1.3s; }
    @keyframes b242bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
    .b242-hot { animation: b242hot 2.8s ease-in-out infinite; }
    @keyframes b242hot { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .b242-tw, .b242-steam, .b242-bob, .b242-hot { animation: none; } .b242-steam { opacity: .6; } }
    .b242-spin { transform-box: fill-box; transform-origin: center; animation: b242spin 1.1s linear infinite; }
    @keyframes b242spin { to { transform: rotate(360deg); } }
    .b242-flow { animation: b242flow .8s linear infinite; }
    @keyframes b242flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .b242-spin, .b242-flow { animation: none; } }
  </style>
  <rect width="920" height="200" fill="url(#b242sky)"/>
  <g fill="#FFF6D8" opacity=".8"><circle cx="70" cy="22" r="1.3"/><circle cx="160" cy="44" r="1"/><circle cx="250" cy="16" r="1.2"/><circle cx="420" cy="30" r="1"/><circle cx="520" cy="12" r="1.4"/><circle cx="640" cy="38" r="1"/><circle cx="760" cy="18" r="1.2"/><circle cx="860" cy="46" r="1"/></g>
  <circle cx="800" cy="38" r="14" fill="#FFF4D2"/>
  <!-- far shore with house lights -->
  <path d="M0 108 L120 104 L260 108 L420 103 L600 107 L780 102 L920 106 L920 118 L0 118 Z" fill="#0D1838"/>
  <g fill="#FFD27A"><rect x="60" y="106" width="3" height="3"/><rect x="190" y="105" width="3" height="3"/><rect x="330" y="105" width="3" height="3"/><rect x="470" y="104" width="3" height="3"/><rect x="700" y="104" width="3" height="3"/><rect x="850" y="104" width="3" height="3"/></g>
  <rect y="116" width="920" height="84" fill="url(#b242sea)"/>
  <!-- boat 1, lit -->
  <g transform="translate(160 118)"><g class="b242-bob">
    <path d="M-60 0 L60 0 L48 14 L-50 14 Z" fill="#2E3A66"/>
    <path d="M-60 0 L60 0" stroke="#FFC24A" stroke-width="2.5" stroke-dasharray="2 5"/>
    <path d="M-20 0 V-30 H14 V0" fill="none" stroke="#5ED1FF" stroke-width="2" stroke-dasharray="2 4"/>
    <path d="M0 -30 V-62" stroke="#3A4466" stroke-width="2"/>
    <path d="M0 -62 L-36 0 M0 -62 L40 0" stroke="#FF5D73" stroke-width="2" stroke-dasharray="2 4"/>
    <circle cx="0" cy="-64" r="3.5" fill="#FFE07A"/>
  </g></g>
  <!-- boat 2, lit -->
  <g transform="translate(395 124)"><g class="b242-bob b2">
    <path d="M-46 0 L46 0 L36 11 L-38 11 Z" fill="#2E3A66"/>
    <path d="M-46 0 L46 0" stroke="#7CFF9C" stroke-width="2.5" stroke-dasharray="2 5"/>
    <path d="M-6 0 V-48" stroke="#3A4466" stroke-width="2"/>
    <path d="M-6 -48 L-30 0 M-6 -48 L28 0" stroke="#FFC24A" stroke-width="2" stroke-dasharray="2 4"/>
    <circle cx="-6" cy="-50" r="3" fill="#FF5D73"/>
  </g></g>
  <!-- light reflections -->
  <g stroke-width="2" opacity=".45"><path d="M120 140 h50 M135 150 h30" stroke="#FFC24A"/><path d="M370 146 h40 M380 156 h22" stroke="#7CFF9C"/></g>
  <!-- dock rail and pelican on a post -->
  <rect x="868" y="96" width="10" height="104" fill="#5B4632"/>
  <g transform="translate(873 96)">
    <path d="M-22 -2 C-26 -14 -16 -24 -2 -24 C10 -24 16 -16 14 -6 C12 2 2 4 -10 3 Z" fill="#7A6A58"/>
    <path d="M-20 -6 C-12 -16 0 -18 10 -12 C2 -8 -10 -4 -20 -6 Z" fill="#5C4E40"/>
    <path d="M-22 -2 L-34 4 L-24 -6 Z" fill="#5C4E40"/>
    <path d="M8 -20 C2 -30 4 -42 12 -46" fill="none" stroke="#6E4A36" stroke-width="7" stroke-linecap="round"/>
    <path d="M9 -22 C4 -30 6 -40 12 -44" fill="none" stroke="#F1EBDD" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="14" cy="-48" rx="6.5" ry="5.5" fill="#F3E7B8"/>
    <path d="M18 -50 L50 -42 L20 -44 Z" fill="#C9A15A"/>
    <path d="M20 -44 Q34 -34 48 -41 L50 -42 Z" fill="#9C7A44"/>
    <circle cx="15.5" cy="-49" r="1.2" fill="#1A1A1A"/>
  </g>
  <!-- boardwalk -->
  <rect y="172" width="920" height="28" fill="#4A3624"/><path d="M0 172 H920" stroke="#6B4E32" stroke-width="3"/>
  <g stroke="#3A2A1C" stroke-width="1.5"><path d="M60 176 v24 M140 176 v24 M220 176 v24 M300 176 v24 M380 176 v24 M460 176 v24 M540 176 v24 M620 176 v24 M700 176 v24 M780 176 v24"/></g>
  <!-- string lights, fed by the wire -->
  <path d="M440 12 Q560 50 680 16 Q760 44 840 14" fill="none" stroke="#2A2F45" stroke-width="2"/>
  <g>
    <circle class="b242-tw" cx="470" cy="22" r="4.5" fill="#FFD27A"/><circle class="b242-tw" cx="505" cy="30" r="4.5" fill="#FF7A6B"/><circle class="b242-tw" cx="540" cy="34" r="4.5" fill="#7CFF9C"/>
    <circle class="b242-tw" cx="575" cy="34" r="4.5" fill="#5ED1FF"/><circle class="b242-tw" cx="610" cy="30" r="4.5" fill="#FFD27A"/><circle class="b242-tw" cx="645" cy="23" r="4.5" fill="#FF7A6B"/>
    <circle class="b242-tw" cx="700" cy="22" r="4.5" fill="#7CFF9C"/><circle class="b242-tw" cx="735" cy="28" r="4.5" fill="#5ED1FF"/><circle class="b242-tw" cx="770" cy="28" r="4.5" fill="#FFD27A"/><circle class="b242-tw" cx="805" cy="22" r="4.5" fill="#FF7A6B"/>
  </g>
  <!-- Rosa's cart with a glowing menu sign -->
  <ellipse cx="640" cy="120" rx="120" ry="60" fill="url(#b242glow)"/>
  <rect x="560" y="118" width="170" height="50" rx="6" fill="#C8553D"/><rect x="556" y="110" width="178" height="10" fill="#8A5E36"/>
  <path d="M566 110 V40 M724 110 V40" stroke="#8A5E36" stroke-width="5"/><path d="M556 42 Q645 22 734 42" fill="#F4E9DA" stroke="#E2D4BE" stroke-width="2"/>
  <circle cx="590" cy="172" r="11" fill="#2A2A2A"/><circle cx="700" cy="172" r="11" fill="#2A2A2A"/>
  <rect x="610" y="74" width="72" height="30" rx="4" fill="#22302A" stroke="#8A5E36" stroke-width="3"/>
  <g fill="#FFE9B8"><rect x="620" y="82" width="34" height="4" rx="2"/><rect x="620" y="92" width="22" height="4" rx="2"/><circle cx="668" cy="88" r="6" fill="#FFD27A"/></g>
  <rect x="694" y="96" width="22" height="22" rx="4" fill="#2D7AA6"/><path d="M700 92 q-4 -7 0 -13 M709 92 q-4 -7 0 -13" fill="none" stroke="#E9E4DA" stroke-width="2" class="b242-steam" opacity=".8"/>
  <!-- the bike on a stand, with the generator -->
  <g transform="translate(470 146)">
    <path d="M-44 26 L-30 6 M44 26 L30 6 M-52 26 H52" stroke="#6F7A84" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(-36 0)"><g class="b242-spin"><circle r="24" fill="none" stroke="#D6DCE0" stroke-width="4"/><path d="M0 -24 V24 M-24 0 H24 M-17 -17 L17 17 M17 -17 L-17 17" stroke="#8C949C" stroke-width="1.6"/><circle r="3" fill="#8C949C"/></g></g>
    <g transform="translate(36 0)"><g class="b242-spin"><circle r="24" fill="none" stroke="#D6DCE0" stroke-width="4"/><path d="M0 -24 V24 M-24 0 H24 M-17 -17 L17 17 M17 -17 L-17 17" stroke="#8C949C" stroke-width="1.6"/><circle r="3" fill="#8C949C"/></g></g>
    <path d="M-36 0 L-6 -30 L36 0 M-6 -30 L-14 -46 M-24 -48 h20 M-6 -30 L28 -38 M28 -38 l6 -12" stroke="#4D96FF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="-10" width="18" height="18" rx="3" fill="#8C949C"/><circle cx="59" cy="-1" r="4" fill="#5C646C"/>
  </g>
  <!-- the wire carrying electrical energy up to the lights -->
  <path d="M537 140 C 520 100, 470 70, 470 22" fill="none" stroke="#3A3220" stroke-width="3"/>
  <path class="b242-flow" d="M537 140 C 520 100, 470 70, 470 22" fill="none" stroke="#FFD27A" stroke-width="2.5" stroke-dasharray="4 5"/>
</svg>
