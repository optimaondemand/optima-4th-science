<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="A brass two-pan balance beside a Florida spring at golden hour. The pan holding a small stone hangs low; the pan holding a big pinecone rides high. Ripple rings spread on the water behind.">
  <defs>
    <linearGradient id="bn27sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C873"/><stop offset="0.55" stop-color="#F2A75C"/><stop offset="1" stop-color="#E08A52"/>
    </linearGradient>
    <linearGradient id="bn27water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0D8"/><stop offset="1" stop-color="#3E8E9C"/>
    </linearGradient>
    <linearGradient id="bn27brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5F1E"/><stop offset="0.5" stop-color="#E8C878"/><stop offset="1" stop-color="#8A5F1E"/>
    </linearGradient>
    <style>
      .bn27-rip { animation: bn27rip 5s ease-out infinite; transform-origin: 0 0; }
      .bn27-rip2 { animation: bn27rip 5s ease-out 2.5s infinite; transform-origin: 0 0; }
      @keyframes bn27rip { 0% { transform: scale(0.25); opacity: 0.9; } 100% { transform: scale(1.1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .bn27-rip, .bn27-rip2 { animation: none; } .bn27-rip2 { opacity: 0; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#bn27sky)"/>
  <circle cx="700" cy="52" r="30" fill="#FBE7B2" opacity="0.95"/>
  <circle cx="700" cy="52" r="44" fill="#FBE7B2" opacity="0.25"/>
  <!-- far tree line -->
  <path d="M0 96 q60 -18 130 -8 q70 10 150 -6 q90 -16 180 -2 q110 14 210 -6 q120 -18 250 2 L920 120 L0 120 z" fill="#B5703F" opacity="0.5"/>
  <!-- spring pool -->
  <rect y="118" width="920" height="82" fill="url(#bn27water)"/>
  <!-- ripple rings around a bobbing seed pod on the water -->
  <g transform="translate(640 150)">
    <g class="bn27-rip"><ellipse rx="64" ry="13" fill="none" stroke="#DFF3F2" stroke-width="2.5"/></g>
    <g class="bn27-rip2"><ellipse rx="64" ry="13" fill="none" stroke="#DFF3F2" stroke-width="2"/></g>
    <ellipse rx="10" ry="4.5" fill="#6B4A2A"/>
  </g>
  <g transform="translate(800 168)">
    <g class="bn27-rip2"><ellipse rx="48" ry="10" fill="none" stroke="#CDEBE9" stroke-width="2"/></g>
  </g>
  <!-- sandy bank, left -->
  <path d="M0 200 L0 128 q120 -4 220 14 q90 16 150 58 z" fill="#E3C690"/>
  <path d="M0 200 L0 150 q100 0 180 20 q70 18 100 30 z" fill="#D2AE72"/>
  <!-- the balance on the bank -->
  <g>
    <rect x="128" y="178" width="104" height="10" rx="4" fill="#5C442E"/>
    <rect x="172" y="88" width="14" height="92" rx="5" fill="#8A5F1E"/>
    <circle cx="179" cy="88" r="7" fill="#8A5F1E"/>
    <!-- beam, tipped toward the stone (left) -->
    <g transform="rotate(-9 179 86)">
      <rect x="84" y="80" width="190" height="9" rx="4.5" fill="url(#bn27brass)" stroke="#8A5F1E" stroke-width="1.5"/>
      <!-- left pan: low, with a small stone -->
      <g transform="translate(94 84)">
        <line x1="0" y1="0" x2="-18" y2="46" stroke="#8A5F1E" stroke-width="2.5"/>
        <line x1="0" y1="0" x2="18" y2="46" stroke="#8A5F1E" stroke-width="2.5"/>
        <path d="M-26 46 q26 20 52 0 z" fill="#C99B3F" stroke="#8A5F1E" stroke-width="2"/>
        <path d="M-10 46 q2 -13 11 -12 q10 1 9 12 z" fill="#7E7A72" stroke="#55524C" stroke-width="1.5"/>
      </g>
      <!-- right pan: high, with a big pinecone -->
      <g transform="translate(264 84)">
        <line x1="0" y1="0" x2="-18" y2="46" stroke="#8A5F1E" stroke-width="2.5"/>
        <line x1="0" y1="0" x2="18" y2="46" stroke="#8A5F1E" stroke-width="2.5"/>
        <path d="M-26 46 q26 20 52 0 z" fill="#C99B3F" stroke="#8A5F1E" stroke-width="2"/>
        <g transform="translate(0 30)">
          <ellipse cx="0" cy="0" rx="14" ry="19" fill="#6B4A2A"/>
          <path d="M-12 -10 q12 6 24 0 M-13 -2 q13 7 26 0 M-12 6 q12 7 24 0 M-9 13 q9 6 18 0" fill="none" stroke="#4A3018" stroke-width="2.3"/>
          <path d="M-6 -17 q6 4 12 0" fill="none" stroke="#4A3018" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
  <!-- cypress and palmetto silhouettes -->
  <path d="M858 200 L858 88 q-3 -22 8 -34 q11 12 8 34 L874 200 z" fill="#6E4E2E"/>
  <path d="M832 142 q26 -18 34 -44 q12 24 2 46 q22 -12 34 -2 q-18 16 -36 12 q10 20 30 26 q-26 6 -40 -12 L856 200 L848 200 q4 -34 -16 -58 z" fill="#2F5D45"/>
  <path d="M36 200 q-6 -34 10 -56 q-22 10 -32 -2 q16 -14 36 -8 q-8 -20 6 -36 q12 18 6 38 q18 -8 30 4 q-16 12 -34 8 q14 22 8 52 z" fill="#2F5D45" opacity="0.9"/>
</svg>
