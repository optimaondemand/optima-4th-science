<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A giant live oak at dusk, tied by thin glowing threads to a barred owl in its hollow, a squirrel holding an acorn, mushrooms at its base, and a bee on a saw palmetto.">
