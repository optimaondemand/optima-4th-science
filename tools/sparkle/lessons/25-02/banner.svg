<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="Morning on the Palmetto Beach boardwalk: two little delivery robots race along the planks toward a finish ribbon. A race clock stands beside the finish. The pier lamp posts and the sea are behind them, and a brown pelican watches from a post.">
  <defs>
    <linearGradient id="b252sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED3F0"/><stop offset=".7" stop-color="#D8EEF6"/><stop offset="1" stop-color="#FCE8C4"/></linearGradient>
    <linearGradient id="b252sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FA9C4"/><stop offset="1" stop-color="#2D7AA6"/></linearGradient>
    <style>
      .b252-a { animation: b252a 2.6s ease-in-out infinite; }
      .b252-b { animation: b252b 2.6s ease-in-out infinite; }
      @keyframes b252a { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
      @keyframes b252b { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
      .b252-rib { animation: b252rib 3s ease-in-out infinite; transform-origin: 790px 128px; }
      @keyframes b252rib { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.8); } }
      .b252-sh { animation: b252sh 6s ease-in-out infinite; }
      @keyframes b252sh { 0%,100% { opacity:.25; } 50% { opacity:.6; } }
      @media (prefers-reduced-motion: reduce) { .b252-a, .b252-b, .b252-rib, .b252-sh { animation: none; } }
    </style>
  </defs>
  <rect width="920" height="200" fill="url(#b252sky)"/>
  <circle cx="110" cy="42" r="22" fill="#FFF3C4"/><circle cx="110" cy="42" r="34" fill="#FFF3C4" opacity=".35"/>
  <path d="M300 36 q18 -14 36 0 q16 -10 30 2 q-30 10 -66 -2z M640 26 q16 -12 32 0 q14 -8 26 2 q-26 8 -58 -2z" fill="#fff" opacity=".8"/>
  <rect y="86" width="920" height="40" fill="url(#b252sea)"/>
  <g class="b252-sh" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M40 98 h36 M210 112 h44 M400 96 h30 M560 114 h40 M740 100 h34 M860 116 h30"/></g>
  <!-- the pier lamp posts, evenly spaced -->
  <g fill="#3C4A57"><rect x="150" y="54" width="4" height="56"/><rect x="330" y="54" width="4" height="56"/><rect x="510" y="54" width="4" height="56"/><rect x="690" y="54" width="4" height="56"/><rect x="870" y="54" width="4" height="56"/></g>
  <g fill="#FFE08A"><circle cx="152" cy="52" r="6"/><circle cx="332" cy="52" r="6"/><circle cx="512" cy="52" r="6"/><circle cx="692" cy="52" r="6"/><circle cx="872" cy="52" r="6"/></g>
  <rect y="110" width="920" height="8" fill="#8A5E36"/>
  <!-- boardwalk planks -->
  <rect y="118" width="920" height="82" fill="#D4AA72"/>
  <g stroke="#A97C46" stroke-width="2"><path d="M0 138 h920 M0 160 h920 M0 182 h920"/><path d="M60 118 v20 M180 118 v20 M300 118 v20 M420 118 v20 M540 118 v20 M660 118 v20 M780 118 v20 M120 138 v22 M240 138 v22 M360 138 v22 M480 138 v22 M600 138 v22 M720 138 v22 M840 138 v22 M60 160 v22 M180 160 v22 M300 160 v22 M420 160 v22 M540 160 v22 M660 160 v22 M780 160 v22"/></g>
  <!-- pelican on a post (right) -->
  <rect x="884" y="92" width="10" height="26" fill="#6E4A28"/>
  <g transform="translate(889 92)"><path d="M-12 -2 q2 -16 16 -16 q12 0 12 14 q0 6 -6 6 h-18 q-6 0 -4 -4z" fill="#8C7A66"/><path d="M-2 -26 q6 -6 10 0 v8 h-10z" fill="#EDE6D6"/><circle cx="3" cy="-22" r="1.6" fill="#222"/><path d="M-2 -21 l-22 6 l22 -1z" fill="#C9A15B"/><path d="M-2 -17 q-12 6 -20 2 l20 -3z" fill="#B88A44"/></g>
  <!-- finish: two posts, a checkered ribbon and a race clock -->
  <rect x="784" y="112" width="6" height="74" fill="#5B4636"/><rect x="784" y="186" width="6" height="0" fill="#5B4636"/>
  <g class="b252-rib"><rect x="790" y="124" width="10" height="56" fill="#fff" stroke="#222" stroke-width="1"/><path d="M790 124 h5 v7 h-5z M795 131 h5 v7 h-5z M790 138 h5 v7 h-5z M795 145 h5 v7 h-5z M790 152 h5 v7 h-5z M795 159 h5 v7 h-5z M790 166 h5 v7 h-5z M795 173 h5 v7 h-5z" fill="#222"/></g>
  <rect x="736" y="70" width="6" height="48" fill="#5B4636"/><rect x="712" y="44" width="54" height="30" rx="5" fill="#1C2733"/><rect x="716" y="48" width="46" height="22" rx="3" fill="#0E1C14"/>
  <g fill="#6BF28C"><rect x="720" y="52" width="6" height="14" rx="1"/><rect x="730" y="52" width="6" height="14" rx="1"/><rect x="742" y="52" width="6" height="14" rx="1"/><rect x="752" y="52" width="6" height="14" rx="1"/><circle cx="739" cy="56" r="1.3"/><circle cx="739" cy="62" r="1.3"/></g>
  <!-- Scoot (blue, ahead) -->
  <g transform="translate(560 140)"><g class="b252-a">
    <path d="M-60 22 h-40 M-64 30 h-28 M-58 14 h-22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <rect x="-36" y="-6" width="52" height="30" rx="8" fill="#2D7AA6"/><rect x="-26" y="-30" width="34" height="24" rx="7" fill="#C9D6DA"/><circle cx="-16" cy="-19" r="4" fill="#1C2733"/><circle cx="-2" cy="-19" r="4" fill="#1C2733"/><path d="M-9 -30 v-8" stroke="#3C4A57" stroke-width="2.5"/><circle cx="-9" cy="-40" r="3" fill="#F5B83D"/>
    <circle cx="-24" cy="27" r="8" fill="#26323A"/><circle cx="6" cy="27" r="8" fill="#26323A"/><circle cx="-24" cy="27" r="3" fill="#9FB3C8"/><circle cx="6" cy="27" r="3" fill="#9FB3C8"/>
  </g></g>
  <!-- Zippy (orange, behind) -->
  <g transform="translate(400 158)"><g class="b252-b">
    <path d="M-52 14 h-22 M-50 22 h-16" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <rect x="-34" y="-8" width="54" height="28" rx="7" fill="#E8792E"/><rect x="-28" y="-30" width="30" height="22" rx="6" fill="#F7D36B"/><circle cx="-19" cy="-20" r="3.6" fill="#1C2733"/><circle cx="-7" cy="-20" r="3.6" fill="#1C2733"/>
    <rect x="-30" y="-2" width="44" height="8" rx="4" fill="#C0392B"/><rect x="-26" y="-4" width="36" height="4" rx="2" fill="#F3C27A"/>
    <circle cx="-22" cy="23" r="7" fill="#26323A"/><circle cx="8" cy="23" r="7" fill="#26323A"/><circle cx="-22" cy="23" r="2.6" fill="#9FB3C8"/><circle cx="8" cy="23" r="2.6" fill="#9FB3C8"/>
  </g></g>
</svg>
